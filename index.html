<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Car Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#05070c;
    color:white;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

/* =========================================================
   START SCREEN
========================================================= */

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}

#startScreen{
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 40%,rgba(0,160,255,.15),transparent 35%),
        linear-gradient(135deg,#04060b,#0a101b 50%,#03050a);
}

.grid{
    position:absolute;
    inset:0;
    opacity:.2;
    background-image:
        linear-gradient(rgba(0,170,255,.2) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,170,255,.2) 1px,transparent 1px);
    background-size:55px 55px;
    transform:perspective(500px) rotateX(60deg) scale(1.5);
    transform-origin:center bottom;
}

.particle{
    position:absolute;
    bottom:-20px;
    width:3px;
    height:3px;
    background:#59d8ff;
    border-radius:50%;
    box-shadow:0 0 12px #59d8ff;
    animation:rise linear infinite;
}

@keyframes rise{
    from{transform:translateY(0);opacity:0}
    15%{opacity:1}
    to{transform:translateY(-110vh);opacity:0}
}

.titleContent{
    position:relative;
    z-index:5;
    text-align:center;
}

.smallLogo{
    color:#64d9ff;
    font-size:14px;
    letter-spacing:5px;
    font-weight:bold;
    margin-bottom:20px;
}

.gameTitle{
    font-size:clamp(55px,9vw,115px);
    line-height:.82;
    letter-spacing:-5px;
    font-weight:1000;
    font-style:italic;
    text-shadow:
        0 0 15px rgba(0,180,255,.5),
        8px 8px 0 rgba(255,255,255,.05);
}

.gameSubtitle{
    margin-top:25px;
    color:#9aa7b8;
    letter-spacing:6px;
    font-size:12px;
}

.startButton{
    margin-top:45px;
    padding:18px 65px;
    color:white;
    background:linear-gradient(135deg,#0797ff,#0058ff);
    border:1px solid #54c8ff;
    border-radius:8px;
    font-size:19px;
    font-weight:900;
    letter-spacing:3px;
    box-shadow:
        0 0 25px rgba(0,120,255,.35),
        inset 0 1px rgba(255,255,255,.3);
    transition:.2s;
}

.startButton:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:0 0 40px rgba(0,160,255,.6);
}

.startButton:active{
    transform:translateY(1px) scale(.98);
}

.versionText{
    margin-top:22px;
    color:#566274;
    font-size:11px;
    letter-spacing:2px;
}

/* =========================================================
   SETUP
========================================================= */

#setupScreen{
    background:
        radial-gradient(circle at 50% 0%,rgba(0,140,255,.12),transparent 35%),
        #070a10;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.setupPage{
    width:min(1150px,96vw);
    height:min(720px,94vh);
    display:flex;
    flex-direction:column;
}

.setupHeader{
    text-align:center;
    margin-bottom:18px;
}

.setupHeader h1{
    font-size:30px;
    letter-spacing:3px;
    font-style:italic;
}

.setupHeader p{
    color:#758194;
    margin-top:7px;
    font-size:13px;
}

.setupProgress{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:18px;
}

.step{
    width:85px;
    height:4px;
    background:#1a2230;
    border-radius:5px;
    transition:.3s;
}

.step.active{
    background:#18a8ff;
    box-shadow:0 0 12px #18a8ff;
}

.setupStage{
    flex:1;
    min-height:0;
    position:relative;
}

.setupPageScreen{
    position:absolute;
    inset:0;
    display:none;
    animation:screenIn .25s ease;
}

.setupPageScreen.active{
    display:block;
}

@keyframes screenIn{
    from{opacity:0;transform:translateX(20px)}
    to{opacity:1;transform:translateX(0)}
}

/* CAR GARAGE */

.garage{
    height:100%;
    display:grid;
    grid-template-columns:1fr 1.35fr;
    gap:20px;
}

.garagePreview{
    position:relative;
    overflow:hidden;
    border:1px solid #202c3b;
    border-radius:18px;
    background:
        radial-gradient(circle at 50% 55%,rgba(0,150,255,.13),transparent 35%),
        linear-gradient(145deg,#0d131d,#070a10);
}

.garageFloor{
    position:absolute;
    left:8%;
    right:8%;
    bottom:16%;
    height:2px;
    background:#218ac0;
    box-shadow:0 0 30px #008cff;
    transform:perspective(300px) rotateX(60deg);
}

.carDisplay{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(-2deg);
    width:65%;
    height:130px;
    transition:.3s;
}

.carBody{
    position:absolute;
    left:5%;
    right:5%;
    bottom:28px;
    height:65px;
    border-radius:38px 55px 18px 18px;
    background:linear-gradient(135deg,#20c9ff,#0564ff 60%,#031c59);
    box-shadow:
        0 15px 35px rgba(0,0,0,.7),
        0 0 30px rgba(0,150,255,.25);
}

.carCabin{
    position:absolute;
    width:43%;
    height:48px;
    left:29%;
    bottom:78px;
    background:linear-gradient(135deg,#263a52,#08101d);
    clip-path:polygon(18% 100%,32% 5%,78% 5%,100% 100%);
    border:1px solid #5b7894;
}

.carWindow{
    position:absolute;
    width:31%;
    height:27px;
    left:35%;
    bottom:86px;
    background:linear-gradient(135deg,#6ee7ff,#07101c);
    clip-path:polygon(20% 100%,31% 5%,75% 5%,90% 100%);
    opacity:.8;
}

.wheel{
    position:absolute;
    width:42px;
    height:42px;
    bottom:7px;
    border-radius:50%;
    background:#05070a;
    border:7px solid #1e2935;
    box-shadow:inset 0 0 0 4px #080b10;
}

.wheel.left{left:15%}
.wheel.right{right:15%}

.carName{
    position:absolute;
    left:25px;
    bottom:25px;
    font-size:28px;
    font-weight:900;
    font-style:italic;
    letter-spacing:2px;
}

.carStats{
    position:absolute;
    left:25px;
    bottom:65px;
    display:flex;
    gap:8px;
}

.stat{
    padding:6px 10px;
    border-radius:5px;
    background:#101924;
    border:1px solid #24384c;
    color:#83d9ff;
    font-size:10px;
    letter-spacing:1px;
}

.garageCars{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    overflow:auto;
    padding:2px;
}

.garageCard{
    position:relative;
    min-height:145px;
    padding:15px;
    border-radius:14px;
    border:1px solid #1c2937;
    background:linear-gradient(145deg,#101720,#080c12);
    transition:.2s;
    cursor:pointer;
    overflow:hidden;
}

.garageCard:hover{
    transform:translateY(-4px);
    border-color:#229fff;
    box-shadow:0 8px 25px rgba(0,130,255,.2);
}

.garageCard.selected{
    border-color:#26b7ff;
    box-shadow:
        0 0 0 1px #26b7ff,
        0 0 25px rgba(0,150,255,.2);
}

.garageCard.locked{
    opacity:.45;
    filter:grayscale(.7);
}

.cardCar{
    position:absolute;
    width:75%;
    height:35px;
    left:12%;
    top:48%;
    border-radius:20px;
    background:linear-gradient(135deg,#2ad7ff,#075aff);
    transform:skewX(-15deg);
    box-shadow:0 10px 15px rgba(0,0,0,.5);
}

.cardCar::before{
    content:"";
    position:absolute;
    width:38%;
    height:25px;
    left:30%;
    top:-17px;
    background:#14283d;
    clip-path:polygon(20% 100%,35% 0,75% 0,95% 100%);
}

.cardWheel{
    position:absolute;
    width:17px;
    height:17px;
    border-radius:50%;
    background:#030507;
    border:3px solid #34404d;
    bottom:-8px;
}

.cardWheel.a{left:13%}
.cardWheel.b{right:13%}

.cardName{
    font-weight:900;
    font-style:italic;
    letter-spacing:1px;
}

.cardUnlock{
    position:absolute;
    right:12px;
    top:12px;
    font-size:10px;
    color:#657386;
}

.cardHint{
    position:absolute;
    bottom:10px;
    left:15px;
    font-size:9px;
    color:#4d647a;
    letter-spacing:1px;
}

.setupChoice{
    height:100%;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.choiceCard{
    position:relative;
    overflow:hidden;
    border:1px solid #1d2b3b;
    border-radius:16px;
    background:#0b1119;
    cursor:pointer;
    transition:.22s;
}

.choiceCard:hover{
    transform:translateY(-5px);
    border-color:#28aaff;
    box-shadow:0 15px 30px rgba(0,120,255,.2);
}

.choiceCard.selected{
    border-color:#23b8ff;
    box-shadow:0 0 0 1px #23b8ff,0 0 30px rgba(0,160,255,.18);
}

.choiceVisual{
    height:65%;
    position:relative;
}

.choiceTitle{
    position:absolute;
    left:18px;
    bottom:15px;
    font-size:22px;
    font-weight:900;
    font-style:italic;
}

.arenaClassic{
    background:
        linear-gradient(90deg,transparent 49.5%,rgba(255,255,255,.3) 50%,transparent 50.5%),
        repeating-linear-gradient(0deg,#11734d 0 30px,#0e6845 30px 60px);
}

.arenaNeon{
    background:
        linear-gradient(90deg,transparent 49.5%,#e5ff00 50%,transparent 50.5%),
        linear-gradient(135deg,#170b38,#280d55 50%,#081c42);
}

.arenaDesert{
    background:
        radial-gradient(circle at 30% 40%,#f8c36a,#b96c32 55%,#633a25);
}

.arenaIce{
    background:
        linear-gradient(135deg,#c9f8ff,#6cc5e9 50%,#326fbc);
}

.difficultyGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    height:100%;
}

.diffCard{
    border:1px solid #1d2a38;
    border-radius:16px;
    background:linear-gradient(145deg,#101721,#080b11);
    padding:25px;
    cursor:pointer;
    transition:.2s;
}

.diffCard:hover{
    transform:translateY(-4px);
    border-color:#28aaff;
}

.diffCard.selected{
    border-color:#23b8ff;
    box-shadow:0 0 0 1px #23b8ff;
}

.diffName{
    font-size:25px;
    font-weight:900;
    font-style:italic;
}

.diffDesc{
    color:#69788a;
    margin-top:8px;
    font-size:12px;
}

.difficultyBar{
    margin-top:25px;
    height:5px;
    background:#182230;
    border-radius:5px;
    overflow:hidden;
}

.difficultyFill{
    height:100%;
    background:#20aaff;
}

/* setup navigation */

.setupNav{
    height:60px;
    display:flex;
    align-items:end;
    justify-content:space-between;
    margin-top:15px;
}

.navButton{
    min-width:150px;
    padding:14px 22px;
    border-radius:8px;
    color:#b9c9da;
    background:#111923;
    border:1px solid #263545;
    font-weight:900;
    letter-spacing:1px;
    transition:.18s;
}

.navButton:hover{
    background:#172636;
    border-color:#35b8ff;
    color:white;
    transform:translateY(-2px);
}

.navButton.primary{
    background:linear-gradient(135deg,#078fff,#0752ff);
    border-color:#42c3ff;
    color:white;
    box-shadow:0 8px 25px rgba(0,100,255,.2);
}

.navButton.primary:hover{
    box-shadow:0 10px 35px rgba(0,130,255,.4);
}

.progressText{
    color:#7b8b9d;
    font-size:11px;
    letter-spacing:1px;
}

/* =========================================================
   GAME
========================================================= */

#gameScreen{
    background:#05070b;
    align-items:center;
    justify-content:center;
}

#gameCanvas{
    width:100vw;
    height:100vh;
    display:block;
}

#scoreboard{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    height:60px;
    min-width:310px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:40px;
    background:rgba(5,10,16,.88);
    border:1px solid #273545;
    border-radius:12px;
    backdrop-filter:blur(10px);
    z-index:10;
}

.score{
    font-size:28px;
    font-weight:900;
}

#blueScore{color:#4ac8ff}
#orangeScore{color:#ff914d}

#timer{
    color:white;
    font-size:22px;
    font-weight:900;
    min-width:55px;
    text-align:center;
}

#pauseButton{
    position:absolute;
    top:22px;
    right:22px;
    z-index:10;
    padding:10px 16px;
    color:#b8c6d4;
    background:rgba(8,13,20,.9);
    border:1px solid #2b3b4d;
    border-radius:7px;
    font-weight:800;
}

#pauseButton:hover{
    border-color:#39b9ff;
    color:white;
}

#boostText{
    position:absolute;
    left:25px;
    bottom:72px;
    font-size:11px;
    color:#73869a;
    letter-spacing:2px;
}

#boostContainer{
    position:absolute;
    left:25px;
    bottom:48px;
    width:210px;
    height:9px;
    background:#101820;
    border:1px solid #263747;
    border-radius:8px;
    overflow:hidden;
}

#boostBar{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#00aaff,#72e8ff);
    box-shadow:0 0 12px #00aaff;
}

#controls{
    position:absolute;
    bottom:15px;
    right:20px;
    color:#637486;
    font-size:10px;
    letter-spacing:1px;
}

#message{
    position:absolute;
    top:95px;
    left:50%;
    transform:translateX(-50%);
    font-size:32px;
    font-weight:1000;
    font-style:italic;
    letter-spacing:3px;
    opacity:0;
    pointer-events:none;
    text-shadow:0 0 20px rgba(255,255,255,.4);
    z-index:20;
}

#message.show{
    animation:goalMessage 1.5s ease forwards;
}

@keyframes goalMessage{
    0%{opacity:0;transform:translate(-50%,15px) scale(.8)}
    20%{opacity:1;transform:translate(-50%,0) scale(1.1)}
    75%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-25px) scale(1)}
}

/* =========================================================
   PAUSE
========================================================= */

#pauseScreen{
    align-items:center;
    justify-content:center;
    background:rgba(2,5,9,.72);
    backdrop-filter:blur(10px);
    z-index:50;
}

.pauseBox{
    width:340px;
    padding:35px;
    border-radius:18px;
    background:#0b1119;
    border:1px solid #2a3949;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.7);
}

.pauseBox h1{
    font-style:italic;
    letter-spacing:3px;
    margin-bottom:25px;
}

.pauseBox button{
    width:100%;
    margin-top:10px;
    padding:13px;
    border-radius:7px;
    color:white;
    background:#111b26;
    border:1px solid #293b4e;
    font-weight:800;
    transition:.18s;
}

.pauseBox button:hover{
    background:#17293a;
    border-color:#25adff;
    transform:translateY(-2px);
}

.pauseBox .restart{
    background:linear-gradient(135deg,#087eff,#064cff);
    border-color:#40bfff;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){
    .garage{
        grid-template-columns:1fr;
    }

    .garagePreview{
        display:none;
    }

    .garageCars{
        grid-template-columns:repeat(2,1fr);
    }

    .setupPage{
        height:94vh;
    }

    .choiceCard{
        min-height:150px;
    }

    .gameTitle{
        letter-spacing:-3px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     START
===================================================== -->

<section id="startScreen" class="screen active">

    <div class="grid"></div>

    <div class="particle" style="left:8%;animation-duration:8s"></div>
    <div class="particle" style="left:17%;animation-duration:12s"></div>
    <div class="particle" style="left:29%;animation-duration:9s"></div>
    <div class="particle" style="left:41%;animation-duration:14s"></div>
    <div class="particle" style="left:53%;animation-duration:10s"></div>
    <div class="particle" style="left:67%;animation-duration:13s"></div>
    <div class="particle" style="left:78%;animation-duration:9s"></div>
    <div class="particle" style="left:91%;animation-duration:11s"></div>

    <div class="titleContent">

        <div class="smallLogo">
            ROCKET CAR STUDIOS
        </div>

        <h1 class="gameTitle">
            ROCKET<br>
            CAR ARENA
        </h1>

        <div class="gameSubtitle">
            BOOST • DRIFT • SCORE • DOMINATE
        </div>

        <button id="startButton" class="startButton">
            START
        </button>

        <div class="versionText">
            v2.0 • LOCAL ARENA
        </div>

    </div>

</section>


<!-- =====================================================
     SETUP
===================================================== -->

<section id="setupScreen" class="screen">

<div class="setupPage">

    <div class="setupHeader">
        <h1 id="setupTitle">GARAGE</h1>
        <p id="setupDescription">Choose your car.</p>
    </div>

    <div class="setupProgress">
        <div class="step active"></div>
        <div class="step"></div>
        <div class="step"></div>
        <div class="step"></div>
    </div>

    <div class="setupStage">

        <!-- CAR PAGE -->

        <div id="carPage" class="setupPageScreen active">

            <div class="garage">

                <div class="garagePreview">

                    <div class="garageFloor"></div>

                    <div id="carDisplay" class="carDisplay">
                        <div class="carBody"></div>
                        <div class="carCabin"></div>
                        <div class="carWindow"></div>
                        <div class="wheel left"></div>
                        <div class="wheel right"></div>
                    </div>

                    <div id="displayStats" class="carStats"></div>

                    <div id="displayCarName" class="carName">
                        VELOCITY X
                    </div>

                </div>

                <div id="garageCars" class="garageCars"></div>

            </div>

        </div>


        <!-- MAP PAGE -->

        <div id="mapPage" class="setupPageScreen">

            <div id="mapChoices" class="setupChoice"></div>

        </div>


        <!-- DIFFICULTY PAGE -->

        <div id="difficultyPage" class="setupPageScreen">

            <div id="difficultyChoices" class="difficultyGrid"></div>

        </div>


        <!-- CONFIRM PAGE -->

        <div id="confirmPage" class="setupPageScreen">

            <div style="
                height:100%;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                text-align:center;
            ">

                <div style="
                    font-size:12px;
                    color:#5e7185;
                    letter-spacing:3px;
                    margin-bottom:15px;
                ">
                    MATCH READY
                </div>

                <div id="confirmCar"
                     style="
                        font-size:48px;
                        font-weight:1000;
                        font-style:italic;
                     ">
                </div>

                <div id="confirmDetails"
                     style="
                        margin-top:20px;
                        color:#7890a4;
                        line-height:2;
                        font-size:13px;
                     ">
                </div>

            </div>

        </div>

    </div>

    <div class="setupNav">

        <div>
            <div id="progressText" class="progressText">
                TOTAL GOALS: 0
            </div>
        </div>

        <div style="display:flex;gap:10px">

            <button id="backButton" class="navButton">
                BACK
            </button>

            <button id="nextButton" class="navButton primary">
                NEXT
            </button>

        </div>

    </div>

</div>

</section>


<!-- =====================================================
     GAME
===================================================== -->

<section id="gameScreen" class="screen">

    <canvas id="gameCanvas"></canvas>

    <div id="scoreboard">

        <div id="blueScore" class="score">0</div>

        <div id="timer">3:00</div>

        <div id="orangeScore" class="score">0</div>

    </div>

    <button id="pauseButton">
        PAUSE
    </button>

    <div id="message"></div>

    <div id="boostText">
        BOOST
    </div>

    <div id="boostContainer">
        <div id="boostBar"></div>
    </div>

    <div id="controls">
        W/S DRIVE &nbsp;&nbsp; A/D TURN &nbsp;&nbsp; SPACE BOOST &nbsp;&nbsp; ESC PAUSE
    </div>

</section>


<!-- =====================================================
     PAUSE
===================================================== -->

<section id="pauseScreen" class="screen">

    <div class="pauseBox">

        <h1>PAUSED</h1>

        <button id="resumeButton">
            RESUME
        </button>

        <button id="restartButton" class="restart">
            RESTART MATCH
        </button>

        <button id="menuButton">
            MAIN MENU
        </button>

    </div>

</section>


<script>

/* =========================================================
   SAVE DATA
========================================================= */

const SAVE_KEY = "rocketCarArenaSave";

let save = JSON.parse(
    localStorage.getItem(SAVE_KEY) || "{}"
);

if(!save.goals) save.goals = 0;
if(!save.unlocked) save.unlocked = [0];

function saveGame(){
    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(save)
    );
}


/* =========================================================
   CARS
========================================================= */

const cars = [

    {
        name:"VELOCITY X",
        unlock:0,
        speed:7,
        acceleration:.18,
        handling:.065,
        boost:1
    },

    {
        name:"VORTEX GT",

    return {

        right:W-margin,
        top:90,
        bottom:H-45

}

/* =========================================================
   PHYSICS HELPERS
========================================================= */

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =========================================================
   CAR PHYSICS
========================================================= */

function updatePlayer(dt){

    const car=cars[selectedCar];

    let throttle=0;

    if(keys["w"]) throttle+=1;
    if(keys["s"]) throttle-=.55;

    if(keys["a"])
        player.angle-=car.handling*dt*60;

    if(keys["d"])
        player.angle+=car.handling*dt*60;

    let acceleration =
        throttle *
        car.acceleration *
        dt *
        60;

    if(keys[" "] && player.boost>0){

        acceleration*=1.9;

        player.boost-=35*dt;

    }else{

        player.boost+=18*dt;

    }

    player.boost=clamp(player.boost,0,100);

    player.vx +=
        Math.cos(player.angle) *
        acceleration;

    player.vy +=
        Math.sin(player.angle) *
        acceleration;

    const maxSpeed =
        car.speed *
        (keys[" "] && player.boost>0 ? 1.45 : 1);

    const speed =
        Math.hypot(player.vx,player.vy);

    if(speed>maxSpeed){

        player.vx =
            player.vx/speed*maxSpeed;

        player.vy =
            player.vy/speed*maxSpeed;

    }

    player.vx*=.985;
    player.vy*=.985;

    player.x+=player.vx;
    player.y+=player.vy;

    keepCarInside(player);

}


/* =========================================================
   BOT AI
========================================================= */

function updateBot(dt){

    const difficulty =
        difficulties[selectedDifficulty];

    const strength =
        difficulty.strength;

    /*
       Instead of simply moving toward the ball,
       the bot predicts where the ball is going.
    */

    const prediction =
        25*strength;

    let targetX =
        ball.x + ball.vx*prediction;

    let targetY =
        ball.y + ball.vy*prediction;

    const f=field();

    /*
       Attack the ball from behind it.
       This stops the bot from hovering beside it.
    */

    const goalX=f.left;

    const goalY=(f.top+f.bottom)/2;

    const dx=targetX-goalX;
    const dy=targetY-goalY;

    const len=Math.hypot(dx,dy)||1;

    const approachX =
        targetX-dx/len*55;

    const approachY =
        targetY-dy/len*55;

    const desired =
        Math.atan2(
            approachY-bot.y,
            approachX-bot.x
        );

    let diff =
        Math.atan2(
            Math.sin(desired-bot.angle),
            Math.cos(desired-bot.angle)
        );

    bot.angle +=
        clamp(diff,-.095*strength,.095*strength);

    const distanceToBall =
        distance(bot,ball);

    let acceleration =
        .18*strength;

    if(distanceToBall<300)
        acceleration=.27*strength;

    bot.vx +=
        Math.cos(bot.angle)*acceleration;

    bot.vy +=
        Math.sin(bot.angle)*acceleration;

    const maxSpeed =
        cars[selectedCar].speed*
        .95*
        strength;

    const speed =
        Math.hypot(bot.vx,bot.vy);

    if(speed>maxSpeed){

        bot.vx=bot.vx/speed*maxSpeed;
        bot.vy=bot.vy/speed*maxSpeed;

    }

    bot.vx*=.988;
    bot.vy*=.988;

    bot.x+=bot.vx;
    bot.y+=bot.vy;

    keepCarInside(bot);

}


/* =========================================================
   KEEP CARS OUT OF WALLS
========================================================= */

function keepCarInside(car){

    const f=field();
    const r=car.radius;

    /*
       Soft wall collision.

       Important:
       velocity is reflected instead of simply clamping
       position every frame. This prevents the car from
       getting glued to the wall.
    */

    if(car.x-r<f.left){

        car.x=f.left+r;

        if(car.vx<0)
            car.vx=Math.abs(car.vx)*.55;

    }

    if(car.x+r>f.right){

        car.x=f.right-r;

        if(car.vx>0)
            car.vx=-Math.abs(car.vx)*.55;

    }

    if(car.y-r<f.top){

        car.y=f.top+r;

        if(car.vy<0)
            car.vy=Math.abs(car.vy)*.55;

    }

    if(car.y+r>f.bottom){

        car.y=f.bottom-r;

        if(car.vy>0)
            car.vy=-Math.abs(car.vy)*.55;

    }

}


/* =========================================================
   BALL PHYSICS
========================================================= */

function updateBall(){

    const f=field();

    ball.x+=ball.vx;
    ball.y+=ball.vy;

    ball.vx*=.992;
    ball.vy*=.992;

    /*
       HARD CORNER FIX

       If the ball reaches a corner, give it a strong
       direction away from BOTH walls.

       This prevents the old "ball stuck in corner"
       problem.
    */

    const nearLeft =
        ball.x-ball.radius<f.left;

    const nearRight =
        ball.x+ball.radius>f.right;

    const nearTop =
        ball.y-ball.radius<f.top;

    const nearBottom =
        ball.y+ball.radius>f.bottom;

    if(nearLeft){

        ball.x=f.left+ball.radius;

        ball.vx=Math.abs(ball.vx);

        if(nearTop){

            ball.y=f.top+ball.radius;
            ball.vy=Math.abs(ball.vy)+1.5;

        }

        if(nearBottom){

            ball.y=f.bottom-ball.radius;
            ball.vy=-Math.abs(ball.vy)-1.5;

        }

    }

    if(nearRight){

        ball.x=f.right-ball.radius;

        ball.vx=-Math.abs(ball.vx);

        if(nearTop){

            ball.y=f.top+ball.radius;
            ball.vy=Math.abs(ball.vy)+1.5;

        }

        if(nearBottom){

            ball.y=f.bottom-ball.radius;
            ball.vy=-Math.abs(ball.vy)-1.5;

        }

    }

    if(nearTop){

        ball.y=f.top+ball.radius;
        ball.vy=Math.abs(ball.vy);

    }

    if(nearBottom){

        ball.y=f.bottom-ball.radius;
        ball.vy=-Math.abs(ball.vy);

    }

    /*
       Keep the ball moving if it somehow gets almost
       completely stopped.
    */

    const speed=Math.hypot(ball.vx,ball.vy);

    if(speed<.08){

        const angle=Math.random()*Math.PI*2;

        ball.vx=Math.cos(angle)*.35;
        ball.vy=Math.sin(angle)*.35;

    }

}


/* =========================================================
   CAR / BALL COLLISION
========================================================= */

function collideCar(car){

    const dx=ball.x-car.x;
    const dy=ball.y-car.y;

    const d=Math.hypot(dx,dy);

    const min=
        ball.radius+car.radius;

    if(d<min){

        const nx=dx/(d||1);
        const ny=dy/(d||1);

        /*
           Push ball OUT of the car.
           This prevents overlap/sticking.
        */

        ball.x=
            car.x+
            nx*(min+.5);

        ball.y=
            car.y+
            ny*(min+.5);

        const carSpeed =
            Math.hypot(car.vx,car.vy);

        const push =
            1.5+carSpeed*.9;

        ball.vx += nx*push;
        ball.vy += ny*push;

        /*
           Transfer a little sideways momentum.
        */

        ball.vx += car.vx*.35;
        ball.vy += car.vy*.35;

    }

}


/* =========================================================
   GOALS
========================================================= */

function goalCheck(){

    const f=field();

    const goalHeight=170;

    const goalTop =
        (f.top+f.bottom)/2-goalHeight/2;

    const goalBottom =
        (f.top+f.bottom)/2+goalHeight/2;

    /*
       Only count a goal if the ball has actually crossed
       the goal line while inside the opening.
    */

    if(
        ball.x-ball.radius<=f.left &&
        ball.y>goalTop &&
        ball.y<goalBottom
    ){

        orangeGoals++;

        scoreGoal("ORANGE");

        return;

    }

    if(
        ball.x+ball.radius>=f.right &&
        ball.y>goalTop &&
        ball.y<goalBottom
    ){

        blueGoals++;

        scoreGoal("BLUE");

    }

}


function scoreGoal(team){

    save.goals++;

    saveGame();

    document.getElementById("message").textContent =
        team+" GOAL";

    const message =
        document.getElementById("message");

    message.classList.remove("show");

    void message.offsetWidth;

    message.classList.add("show");

    document.getElementById("blueScore")
        .textContent=blueGoals;

    document.getElementById("orangeScore")
        .textContent=orangeGoals;

    resetPositions();

}


/* =========================================================
   DRAW FIELD
========================================================= */

function drawField(){

    const f=field();

    ctx.clearRect(0,0,W,H);

    /* background */

    ctx.fillStyle="#06100d";
    ctx.fillRect(0,0,W,H);

    /* field */

    const gradient =
        ctx.createLinearGradient(
            0,f.top,0,f.bottom
        );

    gradient.addColorStop(0,"#0d754d");
    gradient.addColorStop(1,"#075b3d");

    ctx.fillStyle=gradient;

    ctx.fillRect(
        f.left,
        f.top,
        f.right-f.left,
        f.bottom-f.top
    );

    /* field stripes */

    ctx.globalAlpha=.12;

    for(
        let y=f.top;
        y<f.bottom;
        y+=55
    ){

        ctx.fillStyle="#ffffff";

        ctx.fillRect(
            f.left,
            y,
            f.right-f.left,
            27
        );

    }

    ctx.globalAlpha=1;

    /* outer border */

    ctx.strokeStyle="#8cf5ca";
    ctx.lineWidth=4;

    ctx.strokeRect(
        f.left,
        f.top,
        f.right-f.left,
        f.bottom-f.top
    );

    /* centre line */

    ctx.strokeStyle="rgba(255,255,255,.55)";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        (f.left+f.right)/2,
        f.top
    );

    ctx.lineTo(
        (f.left+f.right)/2,
        f.bottom
    );

    ctx.stroke();

    /* centre circle */

    ctx.beginPath();

    ctx.arc(
        (f.left+f.right)/2,
        (f.top+f.bottom)/2,
        80,
        0,
        Math.PI*2
    );

    ctx.stroke();

    /* GOALS */

    drawGoal(f.left,true);
    drawGoal(f.right,false);

}


/* =========================================================
   CLEAN GOALS
========================================================= */

function drawGoal(x,left){

    const f=field();

    const goalHeight=170;

    const y=
        (f.top+f.bottom)/2-
        goalHeight/2;

    const width=42;

    /*
       Clean goal frame.
       No huge side rectangles.
       No visual streaks.
    */

    ctx.strokeStyle=
        left
        ? "#45bfff"
        : "#ff985c";

    ctx.lineWidth=5;

    ctx.strokeRect(
        left
        ? x-width
        : x,
        y,
        width,
        goalHeight
    );

    ctx.fillStyle=
        left
        ? "rgba(40,170,255,.12)"
        : "rgba(255,110,50,.12)";

    ctx.fillRect(
        left
        ? x-width
        : x,
        y,
        width,
        goalHeight
    );

}


/* =========================================================
   DRAW CAR
========================================================= */

function drawCar(car,isPlayer){

    ctx.save();

    ctx.translate(car.x,car.y);

    ctx.rotate(car.angle);

    const colour =
        isPlayer
        ? ["#20c9ff","#0564ff"]
        : ["#ff824d","#a52b12"];

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        10,
        29,
        14,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* body */

    const body =
        ctx.createLinearGradient(
            -25,-15,
            25,15
        );

    body.addColorStop(0,colour[0]);
    body.addColorStop(1,colour[1]);

    ctx.fillStyle=body;

    ctx.beginPath();

    ctx.roundRect(
        -28,
        -14,
        56,
        28,
        9
    );

    ctx.fill();

    /* cabin */

    ctx.fillStyle="#102236";

    ctx.beginPath();

    ctx.moveTo(-15,-12);
    ctx.lineTo(-8,-25);
    ctx.lineTo(12,-25);
    ctx.lineTo(21,-12);

    ctx.closePath();

    ctx.fill();

    /* wheels */

    ctx.fillStyle="#05070a";

    ctx.beginPath();
    ctx.arc(-19,14,7,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(19,14,7,0,Math.PI*2);
    ctx.fill();

    ctx.restore();

}


/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(){

    const glow =
        ctx.createRadialGradient(
            ball.x,
            ball.y,
            2,
            ball.x,
            ball.y,
            20
        );

    glow.addColorStop(0,"#ffffff");
    glow.addColorStop(1,"rgba(255,255,255,0)");

    ctx.fillStyle=glow;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        20,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#f4f7fa";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#aeb8c2";
    ctx.lineWidth=2;

    ctx.stroke();

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(dt){

    gameTime-=dt;

    if(gameTime<0)
        gameTime=0;

    const minutes=
        Math.floor(gameTime/60);

    const seconds=
        Math.floor(gameTime%60);

    document.getElementById("timer")
        .textContent =
        minutes+":"+
        String(seconds).padStart(2,"0");

    if(gameTime<=0){

        matchRunning=false;

        setTimeout(()=>{
            showEndScreen();
        },100);

    }

}


/* =========================================================
   END MATCH
========================================================= */

function showEndScreen(){

    paused=true;

    const winner =
        blueGoals>orangeGoals
        ? "YOU WIN"
        : blueGoals<orangeGoals
        ? "BOT WINS"
        : "DRAW";

    document.getElementById("message")
        .textContent=winner;

    document.getElementById("message")
        .classList.add("show");

    setTimeout(()=>{

        document.getElementById("gameScreen")
            .classList.remove("active");

        document.getElementById("setupScreen")
            .classList.add("active");

        document.getElementById("progressText")
            .textContent=
            "TOTAL GOALS: "+save.goals;

        renderGarage();

        showSetupPage(0);

    },1800);

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(timestamp){

    if(!matchRunning)
        return;

    if(!paused){

        const dt=
            Math.min(
                (timestamp-lastTime)/1000,
                .033
            );

        lastTime=timestamp;

        updatePlayer(dt);
        updateBot(dt);

        collideCar(player);
        collideCar(bot);

        updateBall();

        goalCheck();

        updateTimer(dt);

        drawField();

        drawCar(player,true);
        drawCar(bot,false);

        drawBall();

        document.getElementById("boostBar")
            .style.width=
            player.boost+"%";

    }else{

        lastTime=timestamp;

    }

    requestAnimationFrame(gameLoop);

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(!matchRunning)
        return;

    paused=!paused;

    document.getElementById("pauseScreen")
        .classList.toggle("active",paused);

}


document.getElementById("pauseButton")
.addEventListener("click",togglePause);


document.getElementById("resumeButton")
.addEventListener("click",togglePause);


document.getElementById("restartButton")
.addEventListener("click",()=>{

    document.getElementById("pauseScreen")
        .classList.remove("active");

    blueGoals=0;
    orangeGoals=0;

    gameTime=180;

    resetPositions();

    paused=false;
    matchRunning=true;

});


document.getElementById("menuButton")
.addEventListener("click",()=>{

    matchRunning=false;
    paused=false;

    document.getElementById("pauseScreen")
        .classList.remove("active");

    document.getElementById("gameScreen")
        .classList.remove("active");

    document.getElementById("setupScreen")
        .classList.add("active");

    document.getElementById("progressText")
        .textContent=
        "TOTAL GOALS: "+save.goals;

    renderGarage();

    showSetupPage(0);

});


/* =========================================================
   INITIALISE
========================================================= */

renderGarage();
renderMaps();
renderDifficulties();

</script>

</body>
</html>
