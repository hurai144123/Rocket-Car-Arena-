<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rocket Car Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#05070c;
    color:#fff;
}

button{
    font:inherit;
    border:0;
    outline:0;
    cursor:pointer;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}

/* =========================================================
   MAIN MENU
========================================================= */

#menuScreen{
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,rgba(0,140,255,.16),transparent 35%),
        #05070c;
}

.menuGrid{
    position:absolute;
    inset:-20%;
    opacity:.45;
    background-image:
        linear-gradient(rgba(80,150,220,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(80,150,220,.045) 1px,transparent 1px);
    background-size:55px 55px;
    transform:perspective(550px) rotateX(63deg);
    transform-origin:center bottom;
}

.particle{
    position:absolute;
    bottom:-10px;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#5bbcff;
    box-shadow:0 0 12px #5bbcff;
    animation:particleRise linear infinite;
}

@keyframes particleRise{
    from{
        transform:translateY(0);
        opacity:0;
    }
    10%{opacity:1}
    90%{opacity:1}
    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}

.titleContent{
    position:relative;
    z-index:2;
    text-align:center;
}

.smallLogo{
    color:#69c7ff;
    font-size:13px;
    font-weight:800;
    letter-spacing:7px;
    margin-bottom:22px;
}

.gameTitle{
    font-size:clamp(60px,9vw,125px);
    line-height:.82;
    font-weight:1000;
    font-style:italic;
    letter-spacing:-6px;
    text-shadow:
        0 0 15px rgba(60,180,255,.5),
        0 0 50px rgba(30,110,255,.2);
}

.gameSubtitle{
    margin-top:25px;
    color:#7d8ba0;
    font-size:12px;
    letter-spacing:5px;
}

.startButton{
    margin-top:45px;
    padding:18px 70px;
    border-radius:10px;
    color:white;
    background:linear-gradient(135deg,#0b83ff,#004cc0);
    border:1px solid #57baff;
    font-weight:900;
    letter-spacing:3px;
    box-shadow:
        0 0 25px rgba(0,120,255,.3),
        inset 0 0 20px rgba(255,255,255,.08);
    transition:.2s;
}

.startButton:hover{
    transform:translateY(-4px) scale(1.04);
    box-shadow:
        0 0 40px rgba(0,150,255,.55),
        inset 0 0 20px rgba(255,255,255,.12);
}

.startButton:active{
    transform:scale(.97);
}

.versionText{
    margin-top:24px;
    color:#465266;
    font-size:10px;
    letter-spacing:2px;
}

/* =========================================================
   SETUP
========================================================= */

#setupScreen{
    flex-direction:column;
    background:
        radial-gradient(circle at 50% 15%,rgba(0,120,255,.1),transparent 35%),
        #070a11;
}

.setupTop{
    height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 40px;
    border-bottom:1px solid rgba(255,255,255,.06);
    background:rgba(5,8,14,.65);
}

.setupBrand{
    color:#5fbaff;
    font-size:12px;
    font-weight:900;
    letter-spacing:4px;
}

.setupStep{
    display:flex;
    align-items:center;
    gap:9px;
}

.stepDot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#293548;
    transition:.2s;
}

.stepDot.active{
    width:30px;
    border-radius:10px;
    background:#45aaff;
    box-shadow:0 0 12px rgba(50,160,255,.6);
}

.setupTitle{
    position:absolute;
    top:105px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:5;
}

.setupTitle h1{
    font-size:30px;
    font-style:italic;
    letter-spacing:2px;
}

.setupTitle p{
    margin-top:7px;
    color:#65748a;
    font-size:12px;
}

.setupPages{
    position:absolute;
    inset:82px 0 0;
}

.setupPage{
    position:absolute;
    inset:0;
    display:none;
}

.setupPage.active{
    display:block;
}

/* =========================================================
   GARAGE
========================================================= */

#garagePage{
    overflow:hidden;
}

.garageFloor{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-35%;
    height:75%;
    transform:perspective(700px) rotateX(65deg);
    background:
        linear-gradient(rgba(70,130,190,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(70,130,190,.08) 1px,transparent 1px);
    background-size:55px 55px;
    border-top:1px solid rgba(100,170,230,.12);
}

.garageGlow{
    position:absolute;
    width:600px;
    height:250px;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse,rgba(0,120,255,.2),transparent 65%);
    pointer-events:none;
}

.garageCar{
    position:absolute;
    left:50%;
    top:52%;
    width:460px;
    height:230px;
    transform:translate(-50%,-50%);
    transition:.35s;
    filter:drop-shadow(0 35px 20px rgba(0,0,0,.65));
}

.garageCar:hover{
    transform:translate(-50%,-54%) scale(1.03);
}

.carBody3D{
    position:absolute;
    width:330px;
    height:115px;
    left:65px;
    top:70px;
    background:var(--car);
    border-radius:65px 90px 35px 35px;
    transform:skewX(-9deg);
    box-shadow:
        inset 0 15px 20px rgba(255,255,255,.2),
        inset -15px -15px 25px rgba(0,0,0,.3),
        0 15px 30px rgba(0,0,0,.45);
}

.carRoof{
    position:absolute;
    width:145px;
    height:65px;
    left:155px;
    top:30px;
    border-radius:70px 80px 10px 10px;
    background:linear-gradient(145deg,#dceeff,#526c80);
    transform:skewX(-10deg);
    border:2px solid rgba(255,255,255,.22);
}

.carWindow{
    position:absolute;
    width:105px;
    height:45px;
    left:175px;
    top:39px;
    background:linear-gradient(135deg,#d9f4ff,#284454);
    border-radius:45px 55px 5px 5px;
    transform:skewX(-10deg);
}

.carWheel{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#05070b;
    border:10px solid #252d38;
    box-shadow:inset 0 0 0 5px #0c1118;
    z-index:5;
}

.carWheel.one{
    left:90px;
    top:130px;
}

.carWheel.two{
    right:55px;
    top:130px;
}

.carLight{
    position:absolute;
    width:18px;
    height:10px;
    right:50px;
    top:103px;
    border-radius:50%;
    background:#dff8ff;
    box-shadow:0 0 18px #9fe9ff;
}

.carExhaust{
    position:absolute;
    width:24px;
    height:12px;
    left:48px;
    top:108px;
    border-radius:50%;
    background:#ff713c;
    box-shadow:
        0 0 12px #ff4d20,
        0 0 25px rgba(255,80,20,.7);
}

.garageInfo{
    position:absolute;
    left:55px;
    bottom:90px;
    width:220px;
}

.garageInfo .label{
    color:#5baeff;
    font-size:10px;
    letter-spacing:4px;
    font-weight:900;
}

.garageInfo h2{
    margin-top:8px;
    font-size:42px;
    font-style:italic;
    letter-spacing:-2px;
}

.garageInfo p{
    color:#66768b;
    margin-top:5px;
    font-size:12px;
}

.stat{
    margin-top:13px;
}

.statTop{
    display:flex;
    justify-content:space-between;
    color:#77869a;
    font-size:9px;
    letter-spacing:1px;
    margin-bottom:4px;
}

.statBar{
    height:5px;
    border-radius:10px;
    background:#182332;
    overflow:hidden;
}

.statFill{
    height:100%;
    width:70%;
    border-radius:10px;
    background:linear-gradient(90deg,#168cff,#68caff);
    box-shadow:0 0 10px rgba(50,170,255,.4);
}

.carSelector{
    position:absolute;
    right:40px;
    bottom:70px;
    display:flex;
    gap:10px;
}

.carSelect{
    width:65px;
    height:65px;
    border-radius:12px;
    background:rgba(13,20,31,.85);
    border:1px solid #26364b;
    transition:.2s;
    position:relative;
}

.carSelect:hover{
    transform:translateY(-5px);
    border-color:#4eaeff;
}

.carSelect.selected{
    border-color:#55b8ff;
    box-shadow:
        0 0 0 1px #55b8ff,
        0 0 20px rgba(50,160,255,.25);
}

.miniCar{
    position:absolute;
    left:11px;
    top:23px;
    width:43px;
    height:20px;
    border-radius:12px 15px 6px 6px;
    background:var(--mini);
}

.miniCar:before,
.miniCar:after{
    content:"";
    position:absolute;
    width:11px;
    height:11px;
    bottom:-5px;
    border-radius:50%;
    background:#06080c;
    border:2px solid #333b46;
}

.miniCar:before{left:5px}
.miniCar:after{right:5px}

.clickHint{
    position:absolute;
    right:42px;
    bottom:150px;
    color:#55657b;
    font-size:10px;
    letter-spacing:2px;
}

/* =========================================================
   ARENA PAGE
========================================================= */

.arenaGrid{
    position:absolute;
    inset:155px 50px 115px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    align-items:center;
}

.arenaCard{
    position:relative;
    height:260px;
    overflow:hidden;
    border-radius:18px;
    border:1px solid #26364b;
    background:#0b111a;
    transition:.25s;
    color:white;
    text-align:left;
}

.arenaCard:hover{
    transform:translateY(-8px);
    border-color:#55b6ff;
    box-shadow:0 18px 45px rgba(0,110,255,.22);
}

.arenaCard.selected{
    border-color:#54b8ff;
    box-shadow:
        0 0 0 1px #54b8ff,
        0 0 30px rgba(0,130,255,.25);
}

.arenaImage{
    position:absolute;
    inset:0;
}

.arenaImage.classic{
    background:
        radial-gradient(circle at 50% 50%,transparent 8%,rgba(255,255,255,.12) 8.5%,transparent 9%),
        linear-gradient(135deg,#123f2b,#071810);
}

.arenaImage.neon{
    background:
        radial-gradient(circle at 50% 50%,rgba(150,50,255,.2),transparent 35%),
        linear-gradient(135deg,#28104c,#071b3d);
}

.arenaImage.desert{
    background:
        radial-gradient(circle at 50% 50%,rgba(255,180,80,.15),transparent 35%),
        linear-gradient(135deg,#70401e,#29150a);
}

.arenaImage.ice{
    background:
        radial-gradient(circle at 50% 50%,rgba(150,240,255,.2),transparent 35%),
        linear-gradient(135deg,#1c6078,#09243a);
}

.arenaLines{
    position:absolute;
    left:10%;
    right:10%;
    top:50%;
    height:1px;
    background:rgba(255,255,255,.25);
}

.arenaLines:after{
    content:"";
    position:absolute;
    left:50%;
    top:-35px;
    width:70px;
    height:70px;
    transform:translateX(-50%);
    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;
}

.arenaInfo{
    position:absolute;
    left:18px;
    right:18px;
    bottom:18px;
}

.arenaInfo h2{
    font-size:24px;
    font-style:italic;
}

.arenaInfo span{
    color:#7c8ba0;
    font-size:10px;
    letter-spacing:2px;
}

/* =========================================================
   DIFFICULTY
========================================================= */

.difficultyGrid{
    position:absolute;
    inset:165px 100px 125px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
    align-items:center;
}

.difficultyCard{
    height:240px;
    border-radius:18px;
    background:linear-gradient(145deg,#111a27,#080d14);
    border:1px solid #26364b;
    position:relative;
    overflow:hidden;
    text-align:left;
    color:white;
    padding:25px;
    transition:.25s;
}

.difficultyCard:hover{
    transform:translateY(-8px);
    border-color:#4baeff;
    box-shadow:0 18px 45px rgba(0,100,255,.2);
}

.difficultyCard.selected{
    border-color:#50b5ff;
    box-shadow:
        0 0 0 1px #50b5ff,
        0 0 30px rgba(0,130,255,.22);
}

.diffNumber{
    color:#293b50;
    font-size:60px;
    font-weight:1000;
    font-style:italic;
}

.difficultyCard h2{
    margin-top:15px;
    font-size:25px;
    font-style:italic;
}

.difficultyCard p{
    margin-top:8px;
    color:#66758a;
    font-size:11px;
}

.diffLine{
    position:absolute;
    bottom:0;
    left:0;
    height:4px;
    width:0;
    background:#45aaff;
    transition:.3s;
}

.difficultyCard.selected .diffLine{
    width:100%;
}

/* =========================================================
   NAVIGATION
========================================================= */

.setupBottom{
    position:absolute;
    bottom:22px;
    left:40px;
    right:40px;
    display:flex;
    justify-content:space-between;
    z-index:10;
}

.uiButton{
    min-width:145px;
    padding:13px 24px;
    border-radius:9px;
    color:#b9c9db;
    background:rgba(13,21,32,.9);
    border:1px solid #2c4057;
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    transition:.18s;
}

.uiButton:hover{
    transform:translateY(-3px);
    color:white;
    border-color:#55b7ff;
    box-shadow:0 8px 25px rgba(0,120,255,.2);
}

.uiButton:active{
    transform:translateY(0) scale(.97);
}

.uiButton.primary{
    color:white;
    background:linear-gradient(135deg,#087fff,#0052c7);
    border-color:#55b9ff;
    box-shadow:0 5px 20px rgba(0,100,255,.18);
}

.uiButton.primary:hover{
    box-shadow:0 10px 35px rgba(0,130,255,.4);
}

/* =========================================================
   GAME
========================================================= */

#gameScreen{
    background:#061008;
}

#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#scoreboard{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:25px;
    padding:9px 25px;
    border-radius:14px;
    background:rgba(5,9,15,.85);
    border:1px solid rgba(255,255,255,.1);
    z-index:5;
}

.score{
    min-width:30px;
    text-align:center;
    font-size:28px;
    font-weight:1000;
}

#blueScore{color:#4db7ff}
#orangeScore{color:#ff8a50}

#timer{
    min-width:55px;
    text-align:center;
    font-size:18px;
    font-weight:900;
}

#pauseButton{
    position:absolute;
    right:20px;
    top:20px;
    z-index:10;
    padding:11px 18px;
    border-radius:9px;
    background:rgba(7,13,21,.9);
    border:1px solid #304055;
    color:#b9c9db;
    transition:.2s;
}

#pauseButton:hover{
    color:white;
    border-color:#55b8ff;
}

#boostText{
    position:absolute;
    left:50%;
    bottom:53px;
    transform:translateX(-50%);
    color:#718198;
    font-size:9px;
    letter-spacing:3px;
}

#boostContainer{
    position:absolute;
    left:50%;
    bottom:35px;
    transform:translateX(-50%);
    width:240px;
    height:12px;
    padding:2px;
    background:#101823;
    border:1px solid #334359;
    border-radius:20px;
}

#boostBar{
    height:100%;
    width:100%;
    border-radius:20px;
    background:linear-gradient(90deg,#168cff,#6ed4ff);
    box-shadow:0 0 12px rgba(60,170,255,.5);
}

#controls{
    position:absolute;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    color:#56657a;
    font-size:9px;
    letter-spacing:1px;
}

#message{
    position:absolute;
    left:50%;
    top:105px;
    transform:translateX(-50%);
    z-index:10;
    font-size:42px;
    font-weight:1000;
    font-style:italic;
    opacity:0;
    pointer-events:none;
}

#message.show{
    animation:goalText 1.4s ease;
}

@keyframes goalText{
    0%{
        opacity:0;
        transform:translateX(-50%) scale(.5);
    }
    20%{
        opacity:1;
        transform:translateX(-50%) scale(1.1);
    }
    70%{opacity:1}
    100%{
        opacity:0;
        transform:translateX(-50%) scale(1);
    }
}

/* =========================================================
   PAUSE
========================================================= */

.overlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(2,5,9,.75);
    backdrop-filter:blur(8px);
    z-index:20;
}

.overlay.active{
    display:flex;
}

.pauseBox{
    width:380px;
    padding:35px;
    border-radius:20px;
    background:linear-gradient(145deg,#121c29,#080d14);
    border:1px solid #2d4159;
    text-align:center;
}

.pauseBox h1{
    margin-bottom:20px;
    font-style:italic;
}

.pauseBox button{
    width:100%;
    margin-top:10px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

    .arenaGrid,
    .difficultyGrid{
        grid-template-columns:repeat(2,1fr);
        inset:150px 50px 105px;
    }

    .arenaCard,
    .difficultyCard{
        height:180px;
    }

    .garageCar{
        transform:translate(-50%,-50%) scale(.8);
    }

    .garageInfo{
        left:25px;
        bottom:95px;
    }

    .carSelector{
        right:20px;
        bottom:95px;
    }
}

@media(max-width:600px){

    .setupTop{
        padding:0 15px;
    }

    .setupBrand{
        font-size:9px;
    }

    .setupTitle h1{
        font-size:24px;
    }

    .arenaGrid,
    .difficultyGrid{
        inset:145px 20px 100px;
        gap:10px;
    }

    .arenaCard,
    .difficultyCard{
        height:150px;
        padding:15px;
    }

    .arenaInfo h2,
    .difficultyCard h2{
        font-size:18px;
    }

    .garageCar{
        transform:translate(-50%,-50%) scale(.62);
        top:45%;
    }

    .garageInfo{
        left:20px;
        bottom:95px;
    }

    .garageInfo h2{
        font-size:28px;
    }

    .carSelector{
        right:20px;
        bottom:95px;
        gap:5px;
    }

    .carSelect{
        width:48px;
        height:48px;
    }

    .miniCar{
        transform:scale(.75);
        transform-origin:center;
    }

    .clickHint{
        display:none;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     MAIN MENU
======================================================= -->

<section id="menuScreen" class="screen active">

    <div class="menuGrid"></div>

    <div class="particle" style="left:8%;animation-duration:8s"></div>
    <div class="particle" style="left:17%;animation-duration:12s"></div>
    <div class="particle" style="left:29%;animation-duration:9s"></div>
    <div class="particle" style="left:41%;animation-duration:14s"></div>
    <div class="particle" style="left:53%;animation-duration:10s"></div>
    <div class="particle" style="left:67%;animation-duration:13s"></div>
    <div class="particle" style="left:78%;animation-duration:9s"></div>
    <div class="particle" style="left:91%;animation-duration:11s"></div>

    <div class="titleContent">

        <div class="smallLogo">
            ROCKET CAR STUDIOS
        </div>

        <h1 class="gameTitle">
            ROCKET<br>
            CAR ARENA
        </h1>

        <div class="gameSubtitle">
            BOOST • DRIFT • SCORE • DOMINATE
        </div>

        <button id="startButton" class="startButton">
            START
        </button>

        <div class="versionText">
            v3.0 • LOCAL ARENA
        </div>

    </div>

</section>


<!-- =======================================================
     SETUP
======================================================= -->

<section id="setupScreen" class="screen">

    <div class="setupTop">

        <div class="setupBrand">
            ROCKET CAR ARENA
        </div>

        <div class="setupStep">
            <div class="stepDot active"></div>
            <div class="stepDot"></div>
            <div class="stepDot"></div>
        </div>

    </div>

    <div class="setupTitle">
        <h1 id="setupHeading">GARAGE</h1>
        <p id="setupSubheading">
            Choose your ride.
        </p>
    </div>


    <div class="setupPages">

        <!-- =================================================
             GARAGE
        ================================================== -->

        <div id="garagePage" class="setupPage active">

            <div class="garageFloor"></div>
            <div class="garageGlow"></div>

            <div class="garageCar" id="garageCar">

                <div
                    class="carBody3D"
                    id="garageBody">
                </div>

                <div class="carRoof"></div>
                <div class="carWindow"></div>

                <div class="carWheel one"></div>
                <div class="carWheel two"></div>

                <div class="carLight"></div>
                <div class="carExhaust"></div>

            </div>

            <div class="garageInfo">

                <div class="label">
                    VEHICLE
                </div>

                <h2 id="garageCarName">

<script>

/* =========================================================

const canvas =

const ctx =

let W;
let H;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    const dpr =
        Math.min(window.devicePixelRatio || 1,2);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(

}

/* =========================================================

========================================================= */

const cars = [

    {

/* =========================================================
   ELEMENTS
========================================================= */

const menuScreen =
    document.getElementById("menuScreen");

    document.getElementById("setupScreen");

    document.getElementById("gameScreen");

    document.getElementById("garagePage");

const pages = [

];

/* =========================================================
   GARAGE
========================================================= */

const garageBody =

const garageCarName =
    document.getElementById("garageCarName");

const garageCarDescription =
    document.getElementById("garageCarDescription");

const speedNumber =

const handlingNumber =

const handlingBar =

function buildGarage(){

    carSelector.innerHTML = "";

    cars.forEach((car,index)=>{

        const button =
            document.createElement("button");

        button.className =
            "carSelect" +
            (index === selectedCar
                ? " selected"
                : "");

        button.innerHTML = `
            <div
                class="miniCar"
                style="--mini:${car.color}">
            </div>
        `;

        button.addEventListener(
            "click",
            ()=>selectCar(index)
        );

        carSelector.appendChild(button);

    });

    updateGarage();

}


function selectCar(index){

    selectedCar = index;

    document
        .querySelectorAll(".carSelect")
        .forEach((button,i)=>{
            button.classList.toggle(
                "selected",
                i === selectedCar
            );
        });

    updateGarage();

}


function updateGarage(){

    const car =
        cars[selectedCar];

    garageBody.style
        .setProperty(
            "--car",
            car.color
        );

    garageCarName.textContent =
        car.name;

    garageCarDescription.textContent =
        car.description;

    speedNumber.textContent =
        car.speed;

    handlingNumber.textContent =
        car.handling;

    speedBar.style.width =
        car.speed+"%";

    handlingBar.style.width =
        car.handling+"%";

}

buildGarage();


/* =========================================================
   SETUP NAVIGATION
========================================================= */

const setupHeading =
    document.getElementById("setupHeading");

const setupSubheading =

    setupPage = page;

    pages.forEach((p,i)=>{
        p.classList.toggle(

            i === page
        );
    });

    dots.forEach((dot,i)=>{
        dot.classList.toggle(

            i === page
        );
    });


    const titles = [
        ["GARAGE","Choose your ride."],
        ["ARENA","Choose where you play."],
        ["OPPONENT","Choose your challenge."]
    ];

    setupHeading.textContent =
        titles[page][0];

    setupSubheading.textContent =
        titles[page][1];


    document.getElementById(
        "backButton"
    ).style.visibility =
        page === 0
            ? "hidden"
            : "visible";


    document.getElementById(
        "nextButton"
    ).textContent =
        page === 2
            ? "PLAY MATCH"
            : "NEXT";

}

document

/* =========================================================

document

        }else{

/* =========================================================
   ARENA CLICKING
========================================================= */

document
    .querySelectorAll(".arenaCard")

            "click",

                selectedMap =

                    });

/* =========================================================
   DIFFICULTY CLICKING
========================================================= */

document
    .querySelectorAll(".difficultyCard")
    .forEach(card=>{

        card.addEventListener(

            ()=>{

                selectedDifficulty =

                        ".difficultyCard"
                    )

                        x.classList.remove(

                        );
                    });

                card.classList.add("selected");

            }
        );

/* =========================================================
   GAME OBJECTS
========================================================= */

function createCar(
    x,
    y,
    color,
    isPlayer
){

    const data =
        isPlayer
            ? cars[selectedCar]
            : {
                maxSpeed:
                    selectedDifficulty === "easy"
                        ? 3.4
                        : selectedDifficulty === "normal"
                            ? 4
                            : selectedDifficulty === "hard"
                                ? 4.6
                                : 5.2,

                acceleration:
                    selectedDifficulty === "easy"
                        ? .11
                        : selectedDifficulty === "normal"
                            ? .15
                            : selectedDifficulty === "hard"
                                ? .18
                                : .22
            };


    return {

        x:x,
        y:y,

        vx:0,
        vy:0,

        angle:
            isPlayer
                ? 0
                : Math.PI,

        radius:23,

        color:color,

        isPlayer:isPlayer,

        boost:100,

        maxSpeed:
            isPlayer
                ? data.maxSpeed
                : data.maxSpeed,

        acceleration:
            isPlayer
                ? data.acceleration
                : data.acceleration,

        handling:
            isPlayer
                ? cars[selectedCar].handling/1300
                : .052

    };

}


function createBall(){

    return {
        x:W/2,
        y:H/2,
        vx:0,
        vy:0,
        radius:13
    };

}


/* =========================================================
   ARENA
========================================================= */

function getArena(){

    return {

        left:70,
        right:W-70,

        top:100,
        bottom:H-75,

        goalWidth:145,

        goalDepth:40

    };

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    setupScreen.classList.remove("active");

    gameScreen.classList.add("active");

    blueScore = 0;
    orangeScore = 0;

    matchTime = 180;

    player =
        createCar(
            W*.25,
            H/2,
            cars[selectedCar].color,
            true
        );

    bot =
        createCar(
            W*.75,
            H/2,
            "#ff7043",
            false
        );

    ball =
        createBall();

    resetPositions();

    gameRunning = true;
    paused = false;

    updateScore();

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   RESET
========================================================= */

function resetPositions(){

    player.x = W*.25;
    player.y = H/2;

    player.vx = 0;
    player.vy = 0;

    player.angle = 0;


    bot.x = W*.75;
    bot.y = H/2;

    bot.vx = 0;
    bot.vy = 0;

    bot.angle = Math.PI;


    ball.x = W/2;
    ball.y = H/2;

    ball.vx = 0;
    ball.vy = 0;

}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
    "keydown",
    e=>{

        keys[e.key.toLowerCase()] = true;

        if(e.code === "Space"){

            keys.space = true;

            e.preventDefault();

        }

        if(e.key === "Escape"){

            togglePause();

        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        keys[e.key.toLowerCase()] = false;

        if(e.code === "Space"){

            keys.space = false;

        }

    }
);


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(){

    const forward =
        keys.w || keys.arrowup;

    const backward =
        keys.s || keys.arrowdown;

    const left =
        keys.a || keys.arrowleft;

    const right =
        keys.d || keys.arrowright;


    if(forward){

        player.vx +=
            Math.cos(player.angle) *
            player.acceleration;

        player.vy +=
            Math.sin(player.angle) *
            player.acceleration;

    }


    if(backward){

        player.vx -=
            Math.cos(player.angle) *
            player.acceleration *
            .6;

        player.vy -=
            Math.sin(player.angle) *
            player.acceleration *
            .6;

    }


    if(left)
        player.angle -=
            player.handling;

    if(right)
        player.angle +=
            player.handling;


    if(
        keys.space &&
        player.boost > 0
    ){

        player.vx +=
            Math.cos(player.angle)*.28;

        player.vy +=
            Math.sin(player.angle)*.28;

        player.boost -= .8;

    }else{

        player.boost += .18;

    }


    player.boost =
        Math.max(
            0,
            Math.min(
                100,
                player.boost
            )
        );


    limitSpeed(
        player,
        player.maxSpeed +
        (
            keys.space
                ? 2.3
                : 0
        )
    );


    player.vx *= .985;
    player.vy *= .985;

    player.x += player.vx;
    player.y += player.vy;

    wallCollision(player);

}


/* =========================================================
   BOT
========================================================= */

function updateBot(){

    const dx =
        ball.x-bot.x;

    const dy =
        ball.y-bot.y;

    const target =
        Math.atan2(dy,dx);

    let difference =
        target-bot.angle;


    while(difference > Math.PI)
        difference -= Math.PI*2;

    while(difference < -Math.PI)
        difference += Math.PI*2;


    if(difference > .05){

        bot.angle +=
            bot.handling;

    }else if(difference < -.05){

        bot.angle -=
            bot.handling;

    }


    bot.vx +=
        Math.cos(bot.angle) *
        bot.acceleration;

    bot.vy +=
        Math.sin(bot.angle) *
        bot.acceleration;


    limitSpeed(
        bot,
        bot.maxSpeed
    );


    bot.vx *= .988;
    bot.vy *= .988;

    bot.x += bot.vx;
    bot.y += bot.vy;

    wallCollision(bot);

}


/* =========================================================
   SPEED
========================================================= */

function limitSpeed(car,max){

    const speed =
        Math.hypot(
            car.vx,
            car.vy
        );

    if(speed > max){

        car.vx =
            car.vx/speed*max;

        car.vy =
            car.vy/speed*max;

    }

}


/* =========================================================
   WALL COLLISION
========================================================= */

function wallCollision(car){

    const a =
        getArena();

    const minX =
        a.left+car.radius;

    const maxX =
        a.right-car.radius;

    const minY =
        a.top+car.radius;

    const maxY =
        a.bottom-car.radius;


    if(car.x < minX){

        car.x = minX;

        car.vx =
            Math.abs(car.vx)*.35;

    }


    if(car.x > maxX){

        car.x = maxX;

        car.vx =
            -Math.abs(car.vx)*.35;

    }


    if(car.y < minY){

        car.y = minY;

        car.vy =
            Math.abs(car.vy)*.35;

    }


    if(car.y > maxY){

        car.y = maxY;

        car.vy =
            -Math.abs(car.vy)*.35;

    }

}


/* =========================================================
   BALL
========================================================= */

function updateBall(){

    const a =
        getArena();

    ball.x += ball.vx;
    ball.y += ball.vy;

    ball.vx *= .992;
    ball.vy *= .992;


    const goalTop =
        H/2-a.goalWidth/2;

    const goalBottom =
        H/2+a.goalWidth/2;

    const inGoal =
        ball.y >
        goalTop &&
        ball.y <
        goalBottom;


    if(
        ball.y-ball.radius <
        a.top
    ){

        ball.y =
            a.top+ball.radius;

        ball.vy =
            Math.abs(ball.vy)*.8;

    }


    if(
        ball.y+ball.radius >
        a.bottom
    ){

        ball.y =
            a.bottom-ball.radius;

        ball.vy =
            -Math.abs(ball.vy)*.8;

    }


    /*
       IMPORTANT:
       Goal opening stays open.
    */

    if(
        ball.x-ball.radius <
        a.left &&
        !inGoal
    ){

        ball.x =
            a.left+ball.radius;

        ball.vx =
            Math.abs(ball.vx)*.85;

    }


    if(
        ball.x+ball.radius >
        a.right &&
        !inGoal
    ){

        ball.x =
            a.right-ball.radius;

        ball.vx =
            -Math.abs(ball.vx)*.85;

    }


    /*
       SCORING ZONES
    */

    if(
        ball.x <
        a.left-a.goalDepth &&
        inGoal
    ){

        scoreGoal("orange");

        return;

    }


    if(
        ball.x >
        a.right+a.goalDepth &&
        inGoal
    ){

        scoreGoal("blue");

        return;

    }

}


/* =========================================================
   BALL COLLISION
========================================================= */

function carBallCollision(car){

    const dx =
        ball.x-car.x;

    const dy =
        ball.y-car.y;

    const distance =
        Math.hypot(dx,dy);

    const minimum =
        ball.radius+car.radius;


    if(
        distance <
        minimum
    ){

        let nx;
        let ny;


        if(distance === 0){

            nx=1;
            ny=0;

        }else{

            nx=dx/distance;
            ny=dy/distance;

        }


        const overlap =
            minimum-distance;


        ball.x +=
            nx*overlap;

        ball.y +=
            ny*overlap;


        const carSpeed =
            Math.hypot(
                car.vx,
                car.vy
            );


        const force =
            Math.max(
                3,
                carSpeed*1.45
            );


        ball.vx =
            nx*force+
            car.vx*.3;

        ball.vy =
            ny*force+
            car.vy*.3;


        if(
            car.isPlayer &&
            keys.space &&
            player.boost > 0
        ){

            ball.vx +=
                Math.cos(
                    player.angle
                )*2.5;

            ball.vy +=
                Math.sin(
                    player.angle
                )*2.5;

        }

    }

}


/* =========================================================
   CAR COLLISION
========================================================= */

function carCollision(a,b){

    const dx =
        b.x-a.x;

    const dy =
        b.y-a.y;

    const dist =
        Math.hypot(dx,dy);

    const minimum =
        a.radius+b.radius;


    if(
        dist < minimum &&
        dist > 0
    ){

        const nx =
            dx/dist;

        const ny =
            dy/dist;

        const overlap =
            minimum-dist;


        a.x -=
            nx*overlap*.5;

        a.y -=
            ny*overlap*.5;

        b.x +=
            nx*overlap*.5;

        b.y +=
            ny*overlap*.5;


        const avx=a.vx;
        const avy=a.vy;


        a.vx=b.vx*.65;
        a.vy=b.vy*.65;

        b.vx=avx*.65;
        b.vy=avy*.65;


        wallCollision(a);
        wallCollision(b);

    }

}


/* =========================================================
   GOAL
========================================================= */

function scoreGoal(team){

    if(!gameRunning)
        return;


    if(team === "blue")
        blueScore++;
    else
        orangeScore++;


    updateScore();

    goalFlash=1;


    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        team === "blue"
            ? "GOAL"
            : "OPPONENT SCORED";


    message.classList.remove("show");

    void message.offsetWidth;

    message.classList.add("show");


    resetPositions();

}


/* =========================================================
   SCORE
========================================================= */

function updateScore(){

    document.getElementById(
        "blueScore"
    ).textContent =
        blueScore;

    document.getElementById(
        "orangeScore"
    ).textContent =
        orangeScore;

}


/* =========================================================
   DRAW ARENA
========================================================= */

function drawArena(){

    const a =
        getArena();


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    let topColor;
    let bottomColor;


    if(selectedMap === "neon"){

        topColor="#180d32";
        bottomColor="#07172d";

    }else if(selectedMap === "desert"){

        topColor="#402414";
        bottomColor="#1d1009";

    }else if(selectedMap === "ice"){

        topColor="#123c4e";
        bottomColor="#071b2a";

    }else{

        topColor="#102b1d";
        bottomColor="#06140d";

    }


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        topColor
    );

    gradient.addColorStop(
        1,
        bottomColor
    );


    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       FIELD
    */

    ctx.fillStyle =
        selectedMap === "desert"
            ? "#67391d"
            : selectedMap === "ice"
                ? "#185169"
                : "#123a27";


    ctx.fillRect(
        a.left,
        a.top,
        a.right-a.left,
        a.bottom-a.top
    );


    /*
       FIELD BORDER
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.25)";

    ctx.lineWidth=2;

    ctx.strokeRect(
        a.left,
        a.top,
        a.right-a.left,
        a.bottom-a.top
    );


    /*
       CENTRE LINE
    */

    ctx.beginPath();

    ctx.moveTo(
        W/2,
        a.top
    );

    ctx.lineTo(
        W/2,
        a.bottom
    );

    ctx.stroke();


    /*
       CENTRE CIRCLE
    */

    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        75,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
       GOALS
    */

    const goalTop =
        H/2-a.goalWidth/2;


    /*
       BLUE
    */

    ctx.fillStyle =
        "rgba(55,170,255,.18)";

    ctx.fillRect(
        a.left-28,
        goalTop,
        28,
        a.goalWidth
    );


    ctx.strokeStyle =
        "#4db7ff";

    ctx.lineWidth=4;

    ctx.strokeRect(
        a.left-28,
        goalTop,
        28,
        a.goalWidth
    );


    /*
       ORANGE
    */

    ctx.fillStyle =
        "rgba(255,110,60,.18)";

    ctx.fillRect(
        a.right,
        goalTop,
        28,
        a.goalWidth
    );


    ctx.strokeStyle =
        "#ff754d";

    ctx.strokeRect(
        a.right,
        goalTop,
        28,
        a.goalWidth
    );


    /*
       Clean goal posts.
    */

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        a.left,
        goalTop
    );

    ctx.lineTo(
        a.left,
        goalTop+a.goalWidth
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        a.right,
        goalTop
    );

    ctx.lineTo(
        a.right,
        goalTop+a.goalWidth
    );

    ctx.stroke();

}


/* =========================================================
   DRAW CAR
========================================================= */

function drawCar(car){

    ctx.save();

    ctx.translate(
        car.x,
        car.y
    );

    ctx.rotate(
        car.angle
    );


    /*
       Shadow
    */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        8,
        29,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Wheels
    */

    ctx.fillStyle="#05070a";

    ctx.fillRect(
        -16,
        -18,
        10,
        36
    );

    ctx.fillRect(
        7,
        -18,
        10,
        36
    );


    /*
       Body
    */

    ctx.fillStyle =
        car.color;

    ctx.beginPath();

    ctx.roundRect(
        -26,
        -14,
        52,
        28,
        8
    );

    ctx.fill();


    /*
       Roof
    */

    const glass =
        ctx.createLinearGradient(
            -10,
            -12,
            12,
            5
        );

    glass.addColorStop(
        0,
        "#e4f6ff"
    );

    glass.addColorStop(
        1,
        "#526f81"
    );

    ctx.fillStyle=glass;

    ctx.beginPath();

    ctx.roundRect(
        -10,
        -11,
        20,
        14,
        4
    );

    ctx.fill();


    /*
       Lights
    */

    ctx.fillStyle="#eaffff";

    ctx.fillRect(
        20,
        -8,
        5,
        6
    );

    ctx.fillRect(
        20,
        2,
        5,
        6
    );


    /*
       Player ring
    */

    if(car.isPlayer){

        ctx.strokeStyle =
            "rgba(90,200,255,.65)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            32,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   BALL
========================================================= */

function drawBall(){

    ctx.save();

    ctx.translate(
        ball.x,
        ball.y
    );


    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        2,
        5,
        ball.radius,
        ball.radius*.55,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    const gradient =
        ctx.createRadialGradient(
            -4,
            -5,
            2,
            0,
            0,
            ball.radius
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        1,
        "#9da8b4"
    );


    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        ball.radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle =
        "rgba(0,0,0,.35)";

    ctx.lineWidth=2;

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

    if(!gameRunning)
        return;


    requestAnimationFrame(
        gameLoop
    );


    if(paused)
        return;


    const delta =
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime=time;


    updatePlayer();

    updateBot();

    carBallCollision(player);

    carBallCollision(bot);

    carCollision(
        player,
        bot
    );

    updateBall();


    drawArena();

    drawCar(player);

    drawCar(bot);

    drawBall();


    if(goalFlash > 0){

        ctx.fillStyle =
            `rgba(255,255,255,${goalFlash*.05})`;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        goalFlash *= .88;

    }


    matchTime -=
        1/60;


    if(matchTime <= 0){

        matchTime=0;

        endMatch();

    }


    const minutes =
        Math.floor(
            matchTime/60
        );

    const seconds =
        Math.floor(
            matchTime%60
        );


    document.getElementById(
        "timer"
    ).textContent =
        minutes+
        ":"+
        String(seconds)
            .padStart(2,"0");


    document.getElementById(
        "boostBar"
    ).style.width =
        player.boost+"%";

}


/* =========================================================
   END
========================================================= */

function endMatch(){

    gameRunning=false;

    setTimeout(()=>{

        let result;

        if(
            blueScore >
            orangeScore
        ){

            result="YOU WIN!";

        }else if(
            blueScore <
            orangeScore
        ){

            result="YOU LOSE!";

        }else{

            result="DRAW!";

        }


        alert(result);


        gameScreen.classList.remove(
            "active"
        );

        menuScreen.classList.add(
            "active"
        );

    },100);

}


/* =========================================================
   PAUSE
========================================================= */

const pauseOverlay =
    document.getElementById(
        "pauseOverlay"
    );


function togglePause(){

    if(!gameRunning)
        return;

    paused=!paused;

    pauseOverlay.classList.toggle(
        "active",
        paused
    );

}


document
    .getElementById("pauseButton")
    .addEventListener(
        "click",
        togglePause
    );


document
    .getElementById("resumeButton")
    .addEventListener(
        "click",
        ()=>{

            paused=false;

            pauseOverlay.classList.remove(
                "active"
            );

            lastTime =
                performance.now();

        }
    );


document
    .getElementById("restartButton")
    .addEventListener(
        "click",
        ()=>{

            paused=false;

            pauseOverlay.classList.remove(
                "active"
            );

            blueScore=0;
            orangeScore=0;

            matchTime=180;

            updateScore();

            resetPositions();

            gameRunning=true;

            lastTime =
                performance.now();

        }
    );


document
    .getElementById("menuButton")
    .addEventListener(
        "click",
        ()=>{

            gameRunning=false;
            paused=false;

            pauseOverlay.classList.remove(
                "active"
            );

            gameScreen.classList.remove(
                "active"
            );

            menuScreen.classList.add(
                "active"
            );

        }
    );


/* =========================================================
   INITIAL
========================================================= */

showPage(0);

</script>
