<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rocket Car Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#05070d;
    color:white;
}

button{
    font-family:inherit;
    border:none;
    outline:none;
    cursor:pointer;
}

/* =========================
   GLOBAL
========================= */

.screen{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
}

.screen.active{
    display:flex;
}

/* =========================
   MENU
========================= */

#menuScreen{
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 45%,rgba(0,160,255,.15),transparent 35%),
        radial-gradient(circle at 20% 80%,rgba(0,90,255,.08),transparent 30%),
        #05070d;
}

.gridGlow{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
    transform:perspective(500px) rotateX(60deg) scale(1.8);
    transform-origin:center bottom;
    opacity:.5;
}

.particle{
    position:absolute;
    bottom:-10px;
    width:3px;
    height:3px;
    background:#69c9ff;
    border-radius:50%;
    box-shadow:0 0 10px #69c9ff;
    animation:rise linear infinite;
}

@keyframes rise{
    from{transform:translateY(0);opacity:0}
    10%{opacity:1}
    90%{opacity:1}
    to{transform:translateY(-110vh);opacity:0}
}

.titleContent{
    position:relative;
    z-index:2;
    text-align:center;
}

.smallLogo{
    font-size:14px;
    letter-spacing:6px;
    color:#72cfff;
    margin-bottom:22px;
}

.gameTitle{
    font-size:clamp(58px,9vw,120px);
    line-height:.83;
    font-weight:1000;
    font-style:italic;
    letter-spacing:-5px;
    text-shadow:
        0 0 15px rgba(40,170,255,.5),
        0 0 50px rgba(40,120,255,.2);
}

.gameSubtitle{
    margin-top:25px;
    font-size:13px;
    letter-spacing:5px;
    color:#8290a7;
}

.startButton{
    margin-top:45px;
    padding:18px 65px;
    font-size:18px;
    font-weight:900;
    letter-spacing:3px;
    color:white;
    background:linear-gradient(135deg,#087cff,#0051ca);
    border:1px solid #55b9ff;
    border-radius:10px;
    box-shadow:
        0 0 20px rgba(0,120,255,.35),
        inset 0 0 20px rgba(255,255,255,.08);
    transition:.2s;
}

.startButton:hover{
    transform:translateY(-3px) scale(1.04);
    box-shadow:
        0 0 35px rgba(0,150,255,.65),
        inset 0 0 20px rgba(255,255,255,.12);
}

.versionText{
    margin-top:25px;
    font-size:11px;
    color:#4e5a6d;
    letter-spacing:2px;
}

/* =========================
   SETUP
========================= */

#setupScreen{
    flex-direction:column;
    background:
        radial-gradient(circle at 50% 0%,rgba(0,130,255,.1),transparent 40%),
        #070a11;
}

.setupHeader{
    text-align:center;
    padding:35px 20px 15px;
}

.setupHeader h1{
    font-size:34px;
    letter-spacing:2px;
    font-style:italic;
}

.setupHeader p{
    margin-top:8px;
    color:#69758a;
}

.setupPages{
    position:relative;
    flex:1;
    width:100%;
}

.setupPage{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.setupPage.active{
    display:flex;
}

.pageTitle{
    margin-bottom:25px;
    color:#9fb0c8;
    letter-spacing:3px;
    font-size:13px;
    text-transform:uppercase;
}

.optionGrid{
    display:grid;
    grid-template-columns:repeat(4,minmax(150px,220px));
    gap:18px;
    width:min(100%,900px);
}

.optionCard{
    position:relative;
    min-height:145px;
    padding:20px;
    border:1px solid #26354b;
    border-radius:16px;
    background:
        linear-gradient(145deg,rgba(25,35,50,.95),rgba(9,13,22,.95));
    color:white;
    transition:.2s;
    overflow:hidden;
}

.optionCard::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.07),transparent);
    transform:translateX(-100%);
    transition:.4s;
}

.optionCard:hover::before{
    transform:translateX(100%);
}

.optionCard:hover{
    transform:translateY(-5px);
    border-color:#438dff;
    box-shadow:0 10px 35px rgba(0,100,255,.18);
}

.optionCard.selected{
    border-color:#42a5ff;
    box-shadow:
        0 0 0 1px #42a5ff,
        0 0 30px rgba(0,130,255,.22);
}

.optionCard h3{
    margin-top:12px;
    font-size:18px;
}

.optionCard p{
    margin-top:8px;
    color:#69778b;
    font-size:12px;
}

.arenaPreview{
    width:100%;
    height:65px;
    border-radius:10px;
    background:#101923;
    position:relative;
    overflow:hidden;
}

.arenaPreview.classic{
    background:linear-gradient(135deg,#123c29,#071b13);
}

.arenaPreview.neon{
    background:linear-gradient(135deg,#25114c,#081f45);
}

.arenaPreview.desert{
    background:linear-gradient(135deg,#754019,#2f1709);
}

.arenaPreview.ice{
    background:linear-gradient(135deg,#1d6380,#09243d);
}

.arenaPreview::after{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:1px;
    background:rgba(255,255,255,.25);
}

/* car page */

.carGrid{
    display:grid;
    grid-template-columns:repeat(4,minmax(180px,230px));
    gap:20px;
    width:min(100%,980px);
}

.carCard{
    position:relative;
    height:240px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #26364d;
    background:linear-gradient(150deg,#141c29,#080b12);
    transition:.22s;
}

.carCard:hover{
    transform:translateY(-7px) scale(1.02);
    border-color:#4eabff;
    box-shadow:0 15px 40px rgba(0,100,255,.25);
}

.carCard.selected{
    border-color:#4db1ff;
    box-shadow:
        0 0 0 1px #4db1ff,
        0 0 35px rgba(0,130,255,.3);
}

.carVisual{
    position:absolute;
    inset:35px 15px 55px;
}

.carBody{
    position:absolute;
    width:130px;
    height:58px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:25px 32px 15px 12px;
    background:var(--carColor);
    box-shadow:
        inset 0 8px 12px rgba(255,255,255,.22),
        0 12px 25px rgba(0,0,0,.5);
}

.carBody::before{
    content:"";
    position:absolute;
    width:62px;
    height:25px;
    left:34px;
    top:-16px;
    border-radius:14px 18px 4px 4px;
    background:linear-gradient(135deg,#dff5ff,#607a91);
    border:2px solid rgba(255,255,255,.35);
}

.carBody::after{
    content:"";
    position:absolute;
    width:18px;
    height:8px;
    right:-7px;
    top:22px;
    border-radius:50%;
    background:#ff8b31;
    box-shadow:0 0 15px #ff6a00;
}

.wheel{
    position:absolute;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#05070b;
    border:5px solid #242b35;
    top:35px;
}

.wheel.left{
    left:17px;
}

.wheel.right{
    right:17px;
}

.carName{
    position:absolute;
    bottom:16px;
    left:18px;
    font-size:17px;
    font-weight:900;
    letter-spacing:1px;
}

.carStats{
    position:absolute;
    bottom:16px;
    right:18px;
    font-size:10px;
    color:#708198;
}

.setupBottom{
    height:85px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
}

.gameButton{
    min-width:150px;
    padding:14px 25px;
    border-radius:10px;
    background:#111a28;
    border:1px solid #31445d;
    color:#b9c9dc;
    font-weight:800;
    letter-spacing:1px;
    transition:.2s;
}

.gameButton:hover{
    transform:translateY(-2px);
    border-color:#4aa9ff;
    color:white;
    background:#162338;
    box-shadow:0 8px 25px rgba(0,110,255,.2);
}

.gameButton.primary{
    color:white;
    background:linear-gradient(135deg,#087cff,#0054c9);
    border-color:#5bbaff;
}

.gameButton.primary:hover{
    box-shadow:0 0 30px rgba(0,130,255,.4);
}

.pageIndicator{
    position:absolute;
    bottom:100px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#303b4d;
}

.dot.active{
    width:24px;
    border-radius:10px;
    background:#3da6ff;
}

/* =========================
   GAME
========================= */

#gameScreen{
    background:#071009;
}

#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#scoreboard{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:25px;
    z-index:5;
    padding:9px 25px;
    border-radius:14px;
    background:rgba(5,9,15,.82);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(8px);
}

.score{
    min-width:30px;
    text-align:center;
    font-size:28px;
    font-weight:1000;
}

#blueScore{
    color:#4db7ff;
}

#orangeScore{
    color:#ff964d;
}

#timer{
    font-size:19px;
    font-weight:900;
    color:#dce5ef;
    min-width:55px;
    text-align:center;
}

#pauseButton{
    position:absolute;
    top:20px;
    right:20px;
    z-index:10;
    padding:11px 17px;
    border-radius:9px;
    background:rgba(8,13,21,.85);
    border:1px solid #304054;
    color:#b9c9dc;
    transition:.2s;
}

#pauseButton:hover{
    border-color:#5aaeff;
    color:white;
}

#boostContainer{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    width:240px;
    height:12px;
    border-radius:20px;
    padding:2px;
    background:#101823;
    border:1px solid #344358;
    z-index:5;
}

#boostBar{
    height:100%;
    width:100%;
    border-radius:20px;
    background:linear-gradient(90deg,#26a7ff,#74d4ff);
    box-shadow:0 0 12px rgba(50,170,255,.5);
}

#boostText{
    position:absolute;
    bottom:53px;
    left:50%;
    transform:translateX(-50%);
    font-size:9px;
    letter-spacing:3px;
    color:#8294aa;
}

#controls{
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    color:#56657a;
    font-size:10px;
    letter-spacing:1px;
}

#message{
    position:absolute;
    top:105px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    font-size:42px;
    font-weight:1000;
    font-style:italic;
    opacity:0;
    pointer-events:none;
    text-shadow:0 5px 20px rgba(0,0,0,.8);
}

#message.show{
    animation:goalMessage 1.5s ease;
}

@keyframes goalMessage{
    0%{opacity:0;transform:translateX(-50%) scale(.5)}
    20%{opacity:1;transform:translateX(-50%) scale(1.15)}
    70%{opacity:1}
    100%{opacity:0;transform:translateX(-50%) scale(1)}
}

/* =========================
   PAUSE / RESULT
========================= */

.overlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
    background:rgba(2,5,9,.72);
    backdrop-filter:blur(8px);
}

.overlay.active{
    display:flex;
}

.pauseBox{
    width:min(420px,90%);
    padding:35px;
    text-align:center;
    border-radius:20px;
    background:linear-gradient(145deg,#111a27,#080c13);
    border:1px solid #2d4058;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.pauseBox h1{
    font-size:32px;
    margin-bottom:25px;
}

.pauseBox button{
    width:100%;
    margin-top:10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){
    .optionGrid{
        grid-template-columns:repeat(2,1fr);
        max-width:600px;
    }

    .carGrid{
        grid-template-columns:repeat(2,1fr);
        max-width:500px;
    }

    .setupHeader{
        padding-top:20px;
    }
}

@media(max-height:700px){
    .setupHeader{
        padding:15px;
    }

    .setupHeader h1{
        font-size:25px;
    }

    .optionCard{
        min-height:115px;
    }

    .carCard{
        height:190px;
    }

    .setupBottom{
        height:65px;
    }
}

@media(max-width:600px){
    .gameTitle{
        font-size:58px;
    }

    .optionGrid,
    .carGrid{
        gap:10px;
    }

    .optionCard{
        padding:12px;
    }

    .carCard{
        height:170px;
    }

    .carVisual{
        transform:scale(.8);
    }
}
</style>
</head>

<body>

<!-- =========================
     MAIN MENU
========================= -->

<section id="menuScreen" class="screen active">

    <div class="gridGlow"></div>

    <div class="particle" style="left:8%;animation-duration:8s"></div>
    <div class="particle" style="left:17%;animation-duration:12s"></div>
    <div class="particle" style="left:29%;animation-duration:9s"></div>
    <div class="particle" style="left:41%;animation-duration:14s"></div>
    <div class="particle" style="left:53%;animation-duration:10s"></div>
    <div class="particle" style="left:67%;animation-duration:13s"></div>
    <div class="particle" style="left:78%;animation-duration:9s"></div>
    <div class="particle" style="left:91%;animation-duration:11s"></div>

    <div class="titleContent">

        <div class="smallLogo">
            ROCKET CAR STUDIOS
        </div>

        <h1 class="gameTitle">
            ROCKET<br>
            CAR ARENA
        </h1>

        <div class="gameSubtitle">
            BOOST • DRIFT • SCORE • DOMINATE
        </div>

        <button id="startButton" class="startButton">
            START
        </button>

        <div class="versionText">
            v2.0 • LOCAL ARENA
        </div>

    </div>
</section>


<!-- =========================
     SETUP
========================= -->

<section id="setupScreen" class="screen">

    <div class="setupHeader">

        <h1>MATCH SETUP</h1>

        <p id="setupDescription">
            Choose your arena.
        </p>

    </div>

    <div class="setupPages">

        <!-- PAGE 1 -->

        <div id="arenaPage" class="setupPage active">

            <div class="pageTitle">
                Select Arena
            </div>

            <div class="optionGrid">

                <button class="optionCard selected" data-map="classic">
                    <div class="arenaPreview classic"></div>
                    <h3>Classic</h3>
                    <p>Balanced arena</p>
                </button>

                <button class="optionCard" data-map="neon">
                    <div class="arenaPreview neon"></div>
                    <h3>Neon</h3>
                    <p>High energy arena</p>
                </button>

                <button class="optionCard" data-map="desert">
                    <div class="arenaPreview desert"></div>
                    <h3>Desert</h3>
                    <p>Open field</p>
                </button>

                <button class="optionCard" data-map="ice">
                    <div class="arenaPreview ice"></div>
                    <h3>Ice</h3>
                    <p>Low grip arena</p>
                </button>

            </div>

        </div>


        <!-- PAGE 2 -->

        <div id="difficultyPage" class="setupPage">

            <div class="pageTitle">
                Select Opponent
            </div>

            <div class="optionGrid">

                <button class="optionCard selected" data-difficulty="easy">
                    <h3>Easy</h3>
                    <p>Relaxed opponent</p>
                </button>

                <button class="optionCard" data-difficulty="normal">
                    <h3>Normal</h3>
                    <p>Balanced challenge</p>
                </button>

                <button class="optionCard" data-difficulty="hard">
                    <h3>Hard</h3>
                    <p>Fast and aggressive</p>
                </button>

                <button class="optionCard" data-difficulty="insane">
                    <h3>Insane</h3>
                    <p>Maximum challenge</p>
                </button>

            </div>

        </div>


        <!-- PAGE 3 -->

        <div id="carPage" class="setupPage">

            <div class="pageTitle">
                Select Your Car
            </div>

            <div class="carGrid" id="carOptions"></div>

        </div>

    </div>


    <div class="pageIndicator">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>


    <div class="setupBottom">

        <button id="backButton" class="gameButton">
            BACK
        </button>

        <button id="nextButton" class="gameButton primary">
            NEXT
        </button>

    </div>

</section>


<!-- =========================
     GAME
========================= -->

<section id="gameScreen" class="screen">

    <canvas id="gameCanvas"></canvas>

    <div id="scoreboard">

        <div id="blueScore" class="score">
            0
        </div>

        <div id="timer">
            3:00
        </div>

        <div id="orangeScore" class="score">
            0
        </div>

    </div>

    <button id="pauseButton">
        PAUSE
    </button>

    <div id="message"></div>

    <div id="boostText">
        BOOST
    </div>

    <div id="boostContainer">
        <div id="boostBar"></div>
    </div>

    <div id="controls">
        W/S DRIVE &nbsp; A/D TURN &nbsp; SPACE BOOST &nbsp; ESC PAUSE
    </div>


    <div id="pauseOverlay" class="overlay">

        <div class="pauseBox">

            <h1>PAUSED</h1>

            <button id="resumeButton" class="gameButton primary">
                RESUME
            </button>

            <button id="restartButton" class="gameButton">
                RESTART MATCH
            </button>

            <button id="menuButton" class="gameButton">
                MAIN MENU
            </button>

        </div>

    </div>

</section>


<script>

/* =========================================================
   GAME DATA
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

    W = window.innerWidth;
    H = window.innerHeight;
}

window.addEventListener("resize",resize);
resize();


const cars = [
    {
        name:"VOLT",
        color:"#2196ff",
        speed:4.4,
        acceleration:.18,
        handling:.065,
        boost:100
    },
    {
        name:"NOVA",
        color:"#a855f7",
        speed:4.8,
        acceleration:.20,
        handling:.07,
        boost:100
    },
    {
        name:"APEX",
        color:"#ff5b45",
        speed:5.2,
        acceleration:.22,
        handling:.075,
        boost:100
    },
    {
        name:"TITAN",
        color:"#19d38b",
        speed:4.1,
        acceleration:.16,
        handling:.06,
        boost:130
    }
];


/* =========================================================
   STATE
========================================================= */

let selectedMap = "classic";
let selectedDifficulty = "easy";
let selectedCar = 0;

let setupPage = 0;

let gameRunning = false;
let paused = false;

let blueScore = 0;
let orangeScore = 0;

let matchTime = 180;

let keys = {};

let player;
let bot;
let ball;

let goalFlash = 0;

let lastTime = 0;


/* =========================================================
   UI
========================================================= */

const menuScreen = document.getElementById("menuScreen");
const setupScreen = document.getElementById("setupScreen");
const gameScreen = document.getElementById("gameScreen");

const arenaPage = document.getElementById("arenaPage");
const difficultyPage = document.getElementById("difficultyPage");
const carPage = document.getElementById("carPage");

const pages = [
    arenaPage,
    difficultyPage,
    carPage
];

const dots = document.querySelectorAll(".dot");

const setupDescription =
    document.getElementById("setupDescription");


/* =========================================================
   CAR UI
========================================================= */

const carOptions = document.getElementById("carOptions");

cars.forEach((car,index)=>{

    const card = document.createElement("button");

    card.className =
        "carCard" +
        (index === selectedCar ? " selected" : "");

    card.innerHTML = `
        <div class="carVisual"
             style="--carColor:${car.color}">

            <div class="carBody"></div>

            <div class="wheel left"></div>
            <div class="wheel right"></div>

        </div>

        <div class="carName">
            ${car.name}
        </div>

        <div class="carStats">
            ${car.speed.toFixed(1)} SPD
        </div>
    `;

    card.addEventListener("click",()=>{

        selectedCar = index;

        document.querySelectorAll(".carCard")
            .forEach(x=>x.classList.remove("selected"));

        card.classList.add("selected");

        /*
            Clicking a car now immediately starts
            the match, just like the requested flow.
        */
        startGame();

    });

    carOptions.appendChild(card);

});


/* =========================================================
   SETUP NAVIGATION
========================================================= */

function showSetupPage(page){

    setupPage = page;

    pages.forEach((p,i)=>{
        p.classList.toggle("active",i === page);
    });

    dots.forEach((dot,i)=>{
        dot.classList.toggle("active",i === page);
    });

    const descriptions = [
        "Choose your arena.",
        "Choose your opponent.",
        "Choose your car."
    ];

    setupDescription.textContent =
        descriptions[page];

    document.getElementById("backButton").style.visibility =
        page === 0 ? "hidden" : "visible";

    document.getElementById("nextButton").textContent =
        page === 2 ? "PLAY MATCH" : "NEXT";
}


document.getElementById("startButton")
.addEventListener("click",()=>{

    menuScreen.classList.remove("active");

/* =========================================================
   GAME OBJECTS
========================================================= */

function createCar(x,y,color,isPlayer){

    return {

        x,
        y,

        vx:0,
        vy:0,

        angle:isPlayer ? 0 : Math.PI,

        radius:22,

        color,

        isPlayer,

        boost:100,

        maxSpeed:isPlayer ?
            cars[selectedCar].speed :
            4.0,

        acceleration:isPlayer ?
            cars[selectedCar].acceleration :
            .15,

        handling:isPlayer ?
            cars[selectedCar].handling :
            .06

    };

}


function createBall(){

    return {

        x:W/2,
        y:H/2,

        vx:0,
        vy:0,

        radius:13

    };

}


/* =========================================================
   ARENA GEOMETRY
========================================================= */

function arena(){

    return {

        left:70,
        right:W-70,

        top:100,
        bottom:H-80,

        goalWidth:145,
        goalDepth:28

    };

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    setupScreen.classList.remove("active");
    gameScreen.classList.add("active");

    blueScore = 0;
    orangeScore = 0;

    matchTime = 180;

    player = createCar(
        W*.25,
        H/2,
        cars[selectedCar].color,
        true
    );

    bot = createCar(
        W*.75,
        H/2,
        "#ff7043",
        false
    );

    ball = createBall();

    resetPositions();

    gameRunning = true;
    paused = false;

    updateScore();

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);

}


/* =========================================================
   RESET
========================================================= */

function resetPositions(){

    player.x = W*.25;
    player.y = H/2;

    player.vx = 0;
    player.vy = 0;

    player.angle = 0;

    bot.x = W*.75;
    bot.y = H/2;

    bot.vx = 0;
    bot.vy = 0;

    bot.angle = Math.PI;

    ball.x = W/2;
    ball.y = H/2;

    ball.vx = 0;
    ball.vy = 0;

}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

    if(e.code === "Space"){
        keys.space = true;
        e.preventDefault();
    }

    if(e.key === "Escape"){
        togglePause();
    }

});


window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

    if(e.code === "Space"){
        keys.space = false;
    }

});


/* =========================================================
   PLAYER PHYSICS
========================================================= */

function updatePlayer(dt){

    const forward =
        keys.w || keys.arrowup;

    const backward =
        keys.s || keys.arrowdown;

    const left =
        keys.a || keys.arrowleft;

    const right =
        keys.d || keys.arrowright;


    if(forward){

        player.vx +=
            Math.cos(player.angle) *
            player.acceleration;

        player.vy +=
            Math.sin(player.angle) *
            player.acceleration;

    }


    if(backward){

        player.vx -=
            Math.cos(player.angle) *
            player.acceleration *
            .65;

        player.vy -=
            Math.sin(player.angle) *
            player.acceleration *
            .65;

    }


    if(left){
        player.angle -= player.handling;
    }

    if(right){
        player.angle += player.handling;
    }


    let speed =
        Math.hypot(player.vx,player.vy);


    if(keys.space && player.boost > 0){

        player.vx +=
            Math.cos(player.angle) * .30;

        player.vy +=
            Math.sin(player.angle) * .30;

        player.boost -= .75;

    }else{

        player.boost += .20;

    }


    player.boost =
        Math.max(0,Math.min(100,player.boost));


    const max =
        player.maxSpeed +
        (keys.space ? 2.5 : 0);


    speed =
        Math.hypot(player.vx,player.vy);


    if(speed > max){

        player.vx =
            player.vx/speed * max;

        player.vy =
            player.vy/speed * max;

    }


    player.vx *= .985;
    player.vy *= .985;


    player.x += player.vx;
    player.y += player.vy;


    collideCarWithWalls(player);

}


/* =========================================================
   BOT AI
========================================================= */

function updateBot(){

    /*
       IMPORTANT:
       The bot targets the ball's CURRENT position,
       not a random direction.
    */

    const dx = ball.x - bot.x;
    const dy = ball.y - bot.y;

    const targetAngle =
        Math.atan2(dy,dx);


    let difference =
        normalizeAngle(
            targetAngle - bot.angle
        );


    if(Math.abs(difference) > .08){

        if(difference > 0){
            bot.angle += bot.handling;
        }else{
            bot.angle -= bot.handling;
        }

    }


    /*
       Always move toward the ball.
    */

    bot.vx +=
        Math.cos(bot.angle) *
        bot.acceleration;

    bot.vy +=
        Math.sin(bot.angle) *
        bot.acceleration;


    let speed =
        Math.hypot(bot.vx,bot.vy);


    if(speed > bot.maxSpeed){

        bot.vx =
            bot.vx/speed * bot.maxSpeed;

        bot.vy =
            bot.vy/speed * bot.maxSpeed;

    }


    bot.vx *= .988;
    bot.vy *= .988;


    bot.x += bot.vx;
    bot.y += bot.vy;


    collideCarWithWalls(bot);

}


function normalizeAngle(a){

    while(a > Math.PI){
        a -= Math.PI*2;
    }

    while(a < -Math.PI){
        a += Math.PI*2;
    }

    return a;

}


/* =========================================================
   WALL COLLISION
========================================================= */

function collideCarWithWalls(car){

    const a = arena();

    /*
       Keep cars inside the actual playable field.
       We push them back rather than simply zeroing
       the position, preventing the "stuck to wall" bug.
    */

    const minX = a.left + car.radius;
    const maxX = a.right - car.radius;

    const minY = a.top + car.radius;
    const maxY = a.bottom - car.radius;


    if(car.x < minX){

        car.x = minX;
        car.vx = Math.abs(car.vx) * .35;

    }

    if(car.x > maxX){

        car.x = maxX;
        car.vx = -Math.abs(car.vx) * .35;

    }

    if(car.y < minY){

        car.y = minY;
        car.vy = Math.abs(car.vy) * .35;

    }

    if(car.y > maxY){

        car.y = maxY;
        car.vy = -Math.abs(car.vy) * .35;

    }

}


/* =========================================================
   BALL PHYSICS
========================================================= */

function updateBall(){

    const a = arena();


    ball.x += ball.vx;
    ball.y += ball.vy;


    ball.vx *= .992;
    ball.vy *= .992;


    const goalTop =
        H/2 - a.goalWidth/2;

    const goalBottom =
        H/2 + a.goalWidth/2;


    /*
       TOP / BOTTOM WALLS
    */

    if(ball.y-ball.radius < a.top){

        ball.y =
            a.top + ball.radius;

        ball.vy =
            Math.abs(ball.vy) * .8;

    }


    if(ball.y+ball.radius > a.bottom){

        ball.y =
            a.bottom - ball.radius;

        ball.vy =
            -Math.abs(ball.vy) * .8;

    }


    /*
       LEFT WALL
       EXCEPT inside goal opening.
    */

    const inGoalY =
        ball.y > goalTop &&
        ball.y < goalBottom;


    if(ball.x-ball.radius < a.left){

        if(!inGoalY){

            ball.x =
                a.left + ball.radius;

            ball.vx =
                Math.abs(ball.vx) * .85;

        }

    }


    /*
       RIGHT WALL
    */

    if(ball.x+ball.radius > a.right){

        if(!inGoalY){

            ball.x =
                a.right - ball.radius;

            ball.vx =
                -Math.abs(ball.vx) * .85;

        }

    }


    /*
       GOAL DETECTION
       Uses an invisible scoring zone slightly
       inside the goal instead of requiring the ball
       to travel through the wall.
    */

    const goalDepth = 35;


    if(
        ball.x < a.left - goalDepth &&
        inGoalY
    ){

        scoreGoal("orange");
        return;

    }


    if(
        ball.x > a.right + goalDepth &&
        inGoalY
    ){

        scoreGoal("blue");
        return;

    }


    /*
       If the ball enters the mouth of the goal,
       gently guide it inward.
    */

    if(
        ball.x < a.left &&
        inGoalY
    ){

        ball.vx =
            Math.min(ball.vx,-2);

    }


    if(
        ball.x > a.right &&
        inGoalY
    ){

        ball.vx =
            Math.max(ball.vx,2);

    }

}


/* =========================================================
   CAR / BALL COLLISION
========================================================= */

function carBallCollision(car){

    const dx =
        ball.x-car.x;

    const dy =
        ball.y-car.y;

    const dist =
        Math.hypot(dx,dy);

    const minDist =
        ball.radius + car.radius;


    if(dist < minDist){

        let nx;
        let ny;


        if(dist === 0){

            nx = 1;
            ny = 0;

        }else{

            nx = dx/dist;
            ny = dy/dist;

        }


        /*
           Push the ball out of the car.
           This prevents it from getting trapped.
        */

        const overlap =
            minDist-dist;

        ball.x += nx*overlap;
        ball.y += ny*overlap;


        /*
           Transfer velocity from car to ball.
        */

        const carVelocity =
            Math.hypot(car.vx,car.vy);


        const hitPower =
            Math.max(3,carVelocity*1.4);


        ball.vx =
            nx*hitPower + car.vx*.35;

        ball.vy =
            ny*hitPower + car.vy*.35;


        /*
           Small boost effect.
        */

        if(
            car.isPlayer &&
            keys.space &&
            car.boost > 0
        ){

            ball.vx +=
                Math.cos(car.angle)*3;

            ball.vy +=
                Math.sin(car.angle)*3;

        }

    }

}


/* =========================================================
   CAR VS CAR
========================================================= */

function carCollision(a,b){

    const dx = b.x-a.x;
    const dy = b.y-a.y;

    const dist = Math.hypot(dx,dy);

    const minDist =
        a.radius+b.radius;


    if(dist < minDist && dist > 0){

        const nx = dx/dist;
        const ny = dy/dist;

        const overlap =
            minDist-dist;

        a.x -= nx*overlap*.5;
        a.y -= ny*overlap*.5;

        b.x += nx*overlap*.5;
        b.y += ny*overlap*.5;


        const avx = a.vx;
        const avy = a.vy;

        a.vx = b.vx*.7;
        a.vy = b.vy*.7;

        b.vx = avx*.7;
        b.vy = avy*.7;

        collideCarWithWalls(a);
        collideCarWithWalls(b);

    }

}


/* =========================================================
   GOAL
========================================================= */

function scoreGoal(team){

    if(!gameRunning) return;

    if(team === "blue"){
        blueScore++;
    }else{
        orangeScore++;
    }

    updateScore();

    goalFlash = 1;

    const message =
        document.getElementById("message");

    message.textContent =
        team === "blue" ? "GOAL" : "OPPONENT SCORED";

    message.classList.remove("show");

    void message.offsetWidth;

    message.classList.add("show");


    /*
       Reset ball and cars immediately.
       No particles or white streaks.
    */

    resetPositions();

}


/* =========================================================
   SCORE
========================================================= */

function updateScore(){

    document.getElementById("blueScore")
        .textContent = blueScore;

    document.getElementById("orangeScore")
        .textContent = orangeScore;

}


/* =========================================================
   DRAW ARENA
========================================================= */

function drawArena(){

    const a = arena();

    ctx.clearRect(0,0,W,H);


    /*
       BACKGROUND
    */

    const bg =
        ctx.createLinearGradient(
            0,0,0,H
        );

    if(selectedMap === "neon"){

        bg.addColorStop(0,"#100a24");
        bg.addColorStop(1,"#061329");

    }else if(selectedMap === "desert"){

        bg.addColorStop(0,"#3a2113");
        bg.addColorStop(1,"#1b0f09");

    }else if(selectedMap === "ice"){

        bg.addColorStop(0,"#0e3446");
        bg.addColorStop(1,"#071b2b");

    }else{

        bg.addColorStop(0,"#0d2419");
        bg.addColorStop(1,"#07150f");

    }

    ctx.fillStyle = bg;

    ctx.fillRect(0,0,W,H);


    /*
       FIELD
    */

    ctx.fillStyle =
        selectedMap === "desert"
            ? "#6a3c1d"
            : selectedMap === "ice"
                ? "#18506a"
                : "#123a28";

    ctx.fillRect(
        a.left,
        a.top,
        a.right-a.left,
        a.bottom-a.top
    );


    /*
       FIELD LINES
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.22)";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        a.left,
        a.top,
        a.right-a.left,
        a.bottom-a.top
    );


    ctx.beginPath();

    ctx.moveTo(
        W/2,
        a.top
    );

    ctx.lineTo(
        W/2,
        a.bottom
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        75,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
       GOALS
       Small, clean and obvious.
    */

    const goalTop =
        H/2-a.goalWidth/2;

    const goalBottom =
        H/2+a.goalWidth/2;


    /*
       LEFT GOAL
    */

    ctx.fillStyle =
        "rgba(50,170,255,.18)";

    ctx.fillRect(
        a.left-22,
        goalTop,
        22,
        a.goalWidth
    );

    ctx.strokeStyle =
        "#4db7ff";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        a.left-22,
        goalTop,
        22,
        a.goalWidth
    );


    /*
       RIGHT GOAL
    */

    ctx.fillStyle =
        "rgba(255,110,60,.18)";

    ctx.fillRect(
        a.right,
        goalTop,
        22,
        a.goalWidth
    );

    ctx.strokeStyle =
        "#ff754d";

    ctx.strokeRect(
        a.right,
        goalTop,
        22,
        a.goalWidth
    );


    /*
       GOAL POSTS
    */

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        a.left,
        goalTop
    );

    ctx.lineTo(
        a.left,
        goalBottom
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        a.right,
        goalTop
    );

    ctx.lineTo(
        a.right,
        goalBottom
    );

    ctx.stroke();


    /*
       NO RANDOM PARTICLES / STREAKS.
       Clean arena only.
    */

}


/* =========================================================
   DRAW CAR
========================================================= */

function drawCar(car){

    ctx.save();

    ctx.translate(car.x,car.y);
    ctx.rotate(car.angle);


    /*
       Shadow
    */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        7,
        27,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Wheels
    */

    ctx.fillStyle="#080b10";

    ctx.fillRect(
        -15,
        -17,
        10,
        34
    );

    ctx.fillRect(
        8,
        -17,
        10,
        34
    );


    /*
       Main body
    */

    ctx.fillStyle =
        car.color;

    ctx.beginPath();

    ctx.roundRect(
        -25,
        -14,
        50,
        28,
        8
    );

    ctx.fill();


    /*
       Cabin
    */

    const glass =
        ctx.createLinearGradient(
            -10,-13,
            12,5
        );

    glass.addColorStop(0,"#e6f7ff");
    glass.addColorStop(1,"#527087");

    ctx.fillStyle=glass;

    ctx.beginPath();

    ctx.roundRect(
        -10,
        -11,
        20,
        14,
        4
    );

    ctx.fill();


    /*
       Front lights
    */

    ctx.fillStyle="#eafaff";

    ctx.fillRect(
        20,
        -8,
        4,
        6
    );

    ctx.fillRect(
        20,
        2,
        4,
        6
    );


    /*
       Player marker
    */

    if(car.isPlayer){

        ctx.strokeStyle =
            "rgba(100,210,255,.65)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            31,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(){

    ctx.save();

    ctx.translate(ball.x,ball.y);


    /*
       Shadow
    */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        2,
        5,
        ball.radius,
        ball.radius*.55,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Ball
    */

    const gradient =
        ctx.createRadialGradient(
            -4,-5,
            2,
            0,0,
            ball.radius
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        1,
        "#9ba7b5"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        ball.radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle =
        "rgba(0,0,0,.35)";

    ctx.lineWidth=2;

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

    if(!gameRunning) return;

    requestAnimationFrame(gameLoop);


    if(paused) return;


    const delta =
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime=time;


    updatePlayer(delta);

    updateBot();

    carBallCollision(player);
    carBallCollision(bot);

    carCollision(player,bot);

    updateBall();

    drawArena();

    drawCar(player);

    drawCar(bot);

    drawBall();


    if(goalFlash > 0){

        ctx.fillStyle =
            `rgba(255,255,255,${goalFlash*.06})`;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        goalFlash *= .88;

    }


    /*
       TIMER
    */

    matchTime -=
        1/60;


    if(matchTime <= 0){

        matchTime = 0;

        endMatch();

    }


    const minutes =
        Math.floor(matchTime/60);

    const seconds =
        Math.floor(matchTime%60);

    document.getElementById("timer")
        .textContent =
            minutes + ":" +
            String(seconds).padStart(2,"0");


    document.getElementById("boostBar")
        .style.width =
            player.boost + "%";

}


/* =========================================================
   END MATCH
========================================================= */

function endMatch(){

    gameRunning=false;

    setTimeout(()=>{

        alert(
            blueScore > orangeScore
                ? "YOU WIN!"
                : blueScore < orangeScore
                    ? "YOU LOSE!"
                    : "DRAW!"
        );

        gameScreen.classList.remove("active");
        menuScreen.classList.add("active");

    },100);

}


/* =========================================================
   PAUSE
========================================================= */

const pauseOverlay =
    document.getElementById("pauseOverlay");


function togglePause(){

    if(!gameRunning) return;

    paused = !paused;

    pauseOverlay.classList.toggle(
        "active",
        paused
    );

}


document.getElementById("pauseButton")
.addEventListener("click",togglePause);


document.getElementById("resumeButton")
.addEventListener("click",()=>{

    paused=false;

    pauseOverlay.classList.remove("active");

    lastTime=performance.now();

});


document.getElementById("restartButton")
.addEventListener("click",()=>{

    paused=false;

    pauseOverlay.classList.remove("active");

    blueScore=0;
    orangeScore=0;

    matchTime=180;

    updateScore();

    resetPositions();

    gameRunning=true;

    lastTime=performance.now();

});


document.getElementById("menuButton")
.addEventListener("click",()=>{

    gameRunning=false;
    paused=false;

    pauseOverlay.classList.remove("active");

    gameScreen.classList.remove("active");
    menuScreen.classList.add("active");

});


/* =========================================================
   INITIAL STATE
========================================================= */

showSetupPage(0);

</script>
